<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>Cambiar contraseña</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card p-4 mx-auto" style="max-width:400px; border-radius:20px">

            <h4 class="text-center text-danger mb-4">
                Cambiar contraseña
            </h4>

            <!-- Mensaje de éxito -->
            <div th:if="${message}" class="alert alert-success text-center">

                <span th:text="${message}"></span>

                <p class="mt-2 mb-0" id="countdown">
                    Redirigiendo en 3 segundos...
                </p>

            </div>

            <!-- Formulario -->
            <form method="post" action="/reset-password" th:if="${message == null}">

                <input type="hidden" name="token" th:value="${token}">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">

                    <label>Nueva contraseña</label>

                    <input type="password" name="password" class="form-control" required>

                </div>

                <button class="btn btn-danger w-100">

                    Actualizar contraseña

                </button>

            </form>

        </div>

    </div>

</body>

<script th:if="${message}">

    let time = 3;

    const countdown = setInterval(function () {

        time--;

        document.getElementById("countdown").innerText =
            "Redirigiendo en " + time + " segundos...";

        if (time <= 0) {

            clearInterval(countdown);

            window.location.href = "/login";

        }

    }, 1000);

</script>

</html>
