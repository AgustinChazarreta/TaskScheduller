<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Cambiar contraseña | Functions Planner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" media="print"
        onload="this.media='all'">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/adminlte.css">

    <style>
        body.login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Source Sans 3', sans-serif;

            background:
                radial-gradient(circle at 20% 30%, rgba(217, 83, 79, .08), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(217, 83, 79, .08), transparent 40%),
                linear-gradient(135deg, #f8f9fa, #e9eff5);
        }

        .login-box {
            width: 380px;
        }

        .card {
            border-radius: 22px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, .92);
            border: 1px solid rgba(0, 0, 0, .05);

            box-shadow:
                0 15px 40px rgba(0, 0, 0, .10),
                0 2px 6px rgba(0, 0, 0, .05);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 1.4rem;
        }

        .login-logo span {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: .4px;
            color: #d9534f;
        }

        .login-card-body {
            padding: 2rem;
        }

        .login-box-msg {
            text-align: center;
            margin-bottom: 1.4rem;
            color: #555;
        }

        .form-control {
            border-radius: 12px;
        }

        .input-group-text {
            background: #f8f9fa;
            border-radius: 12px;
            cursor: pointer;
        }

        .form-control:focus {
            border-color: #d9534f;
            box-shadow: 0 0 0 3px rgba(217, 83, 79, .15);
        }

        .btn-primary {
            background: linear-gradient(135deg, #d9534f, #c12e2a);
            border: none;
            border-radius: 12px;
            font-weight: 600;
        }

        .rule-valid {
            color: #198754;
        }

        .rule-invalid {
            color: #6c757d;
        }
    </style>
</head>

<body class="login-page">

    <div class="login-box">

        <div class="login-logo">
            <span>
                <i class="bi bi-calendar-check me-2"></i>
                Functions Planner
            </span>
        </div>

        <div class="card">

            <div class="card-body login-card-body">

                <p class="login-box-msg">
                    Ingresa tu nueva contraseña
                </p>

                <div th:if="${message}" class="alert alert-success text-center">
                    <span th:text="${message}"></span>
                    <p class="mt-2 mb-0" id="countdown">
                        Redirigiendo en 3 segundos...
                    </p>
                </div>

                <div th:if="${error}" class="alert alert-danger text-center">
                    <span th:text="${error}"></span>
                </div>

                <form method="post" action="/reset-password" th:if="${message == null}">

                    <input type="hidden" name="token" th:value="${token}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <!-- PASSWORD -->
                    <div class="input-group mb-3">

                        <input id="newPassword" type="password" name="password" class="form-control"
                            placeholder="Nueva contraseña" required>

                        <div class="input-group-text" onclick="togglePassword()">
                            <i id="eyeIcon" class="bi bi-eye"></i>
                        </div>

                    </div>

                    <!-- CONFIRM PASSWORD -->
                    <div class="input-group mb-3">

                        <input id="confirmPassword" type="password" class="form-control"
                            placeholder="Confirmar contraseña" required>

                    </div>

                    <!-- REGLAS -->
                    <div class="password-rules small mt-2">

                        <div id="rule-length" class="rule-invalid">• mínimo 8 caracteres</div>
                        <div id="rule-upper" class="rule-invalid">• una letra mayúscula</div>
                        <div id="rule-lower" class="rule-invalid">• una letra minúscula</div>
                        <div id="rule-number" class="rule-invalid">• un número</div>
                        <div id="rule-symbol" class="rule-invalid">• un símbolo</div>
                        <div id="rule-match" class="rule-invalid">• las contraseñas coinciden</div>

                    </div>

                    <button class="btn btn-primary w-100 mt-3" id="submitBtn" disabled>

                        <span id="btnText">
                            Actualizar contraseña
                        </span>

                        <span id="btnLoader" class="spinner-border spinner-border-sm d-none">
                        </span>

                    </button>

                </form>

            </div>
        </div>
    </div>

    <script>

        const passwordInput = document.getElementById("newPassword");
        const confirmInput = document.getElementById("confirmPassword");
        const submitBtn = document.getElementById("submitBtn");

        function togglePassword() {

            const input = document.getElementById("newPassword");
            const icon = document.getElementById("eyeIcon");

            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace("bi-eye", "bi-eye-slash");
            } else {
                input.type = "password";
                icon.classList.replace("bi-eye-slash", "bi-eye");
            }

        }

        function toggleRule(id, valid) {

            const el = document.getElementById(id);

            if (valid) {
                el.classList.add("rule-valid");
                el.classList.remove("rule-invalid");
            } else {
                el.classList.add("rule-invalid");
                el.classList.remove("rule-valid");
            }

        }

        function validatePassword() {

            const value = passwordInput.value;

            const length = value.length >= 8;
            const upper = /[A-Z]/.test(value);
            const lower = /[a-z]/.test(value);
            const number = /[0-9]/.test(value);
            const symbol = /[@$!%*?&._-]/.test(value);
            const match = value === confirmInput.value && value.length > 0;

            toggleRule("rule-length", length);
            toggleRule("rule-upper", upper);
            toggleRule("rule-lower", lower);
            toggleRule("rule-number", number);
            toggleRule("rule-symbol", symbol);
            toggleRule("rule-match", match);

            const valid = length && upper && lower && number && symbol && match;

            submitBtn.disabled = !valid;

        }

        passwordInput.addEventListener("input", validatePassword);
        confirmInput.addEventListener("input", validatePassword);

        document.querySelector("form")?.addEventListener("submit", () => {

            document.getElementById("btnText").classList.add("d-none");
            document.getElementById("btnLoader").classList.remove("d-none");

            submitBtn.disabled = true;

        });

    </script>

    <script th:if="${message}">

        let time = 3;

        const countdown = setInterval(function () {

            time--;

            document.getElementById("countdown").innerText =
                "Redirigiendo en " + time + " segundos...";

            if (time <= 0) {

                clearInterval(countdown);

                window.location.href = "/login";

            }

        }, 1000);

    </script>

</body>

</html>
