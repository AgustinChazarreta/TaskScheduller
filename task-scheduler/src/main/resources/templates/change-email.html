<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::section})}">

<section class="container py-4 d-flex align-items-center justify-content-center" style="min-height:80vh;">

    <div class="row w-100 justify-content-center">

        <div class="col-md-6 col-lg-4">

            <div class="card shadow-sm">

                <div class="card-header">
                    <h5 class="mb-0">
                        <i class="bi bi-envelope me-2"></i>
                        Cambiar email
                    </h5>
                </div>

                <div class="card-body">

                    <!-- MENSAJES -->
                    <div th:if="${errorMessage}" class="alert alert-danger">
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <div th:if="${successMessage}" class="alert alert-success">
                        <span th:text="${successMessage}"></span>
                    </div>

                    <!-- EMAIL ACTUAL -->
                    <div class="mb-3">

                        <label class="form-label text-muted small">
                            Email actual
                        </label>

                        <div class="form-control bg-light">
                            <span th:text="${currentEmail}">
                                usuario@email.com
                            </span>
                        </div>

                    </div>

                    <form th:action="@{/change-email}" method="post">

                        <!-- NUEVO EMAIL -->
                        <div class="mb-3">

                            <label class="form-label">
                                Nuevo email
                            </label>

                            <input id="newEmail" type="email" name="email" class="form-control" required>

                        </div>

                        <!-- CONFIRM EMAIL -->
                        <div class="mb-3">

                            <label class="form-label">
                                Confirmar email
                            </label>

                            <input id="confirmEmail" type="email" class="form-control" required>

                            <div id="emailMatch" class="small text-muted mt-1">
                                Los emails deben coincidir
                            </div>

                        </div>

                        <div class="d-flex justify-content-end gap-2">

                            <a href="javascript:history.back()" class="btn btn-secondary">
                                Cancelar
                            </a>

                            <button id="submitBtn" type="submit" class="btn btn-primary" disabled>

                                <i class="bi bi-check-lg me-1"></i>
                                Actualizar email

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script>

        const email = document.getElementById("newEmail");
        const confirm = document.getElementById("confirmEmail");
        const matchText = document.getElementById("emailMatch");
        const submitBtn = document.getElementById("submitBtn");

        function validateEmail() {

            const valid = email.value === confirm.value
                && email.value.length > 0;

            if (valid) {
                matchText.textContent = "Los emails coinciden";
                matchText.style.color = "#198754";
            } else {
                matchText.textContent = "Los emails deben coincidir";
                matchText.style.color = "#6c757d";
            }

            submitBtn.disabled = !valid;

        }

        email.addEventListener("input", validateEmail);
        confirm.addEventListener("input", validateEmail);

    </script>

</section>

</html>
