<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::section})}">

<section class="container py-4 d-flex align-items-center justify-content-center" style="min-height: 80vh;">

    <style>
        .rule-valid {
            color: #198754;
        }

        .rule-invalid {
            color: #6c757d;
        }

        .password-rules {
            font-size: .9rem;
        }

        .input-group-text {
            cursor: pointer;
        }
    </style>

    <div class="row w-100 justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm">

                <div class="card-header">
                    <h5 class="mb-0">
                        <i class="bi bi-key me-2"></i>
                        Cambiar contraseña
                    </h5>
                </div>

                <div class="card-body">

                    <!-- MENSAJES -->
                    <div th:if="${errorMessage}" class="alert alert-danger">
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <div th:if="${successMessage}" class="alert alert-success">
                        <span th:text="${successMessage}"></span>
                    </div>

                    <form th:action="@{/change-password}" method="post">

                        <!-- PASSWORD -->
                        <div class="mb-3">

                            <label class="form-label">
                                Nueva contraseña
                            </label>

                            <div class="input-group">

                                <input id="newPassword" type="password" name="password" class="form-control"
                                    autocomplete="new-password" required>

                                <span class="input-group-text" onclick="togglePassword()">

                                    <i id="eyeIcon" class="bi bi-eye"></i>

                                </span>

                            </div>

                        </div>

                        <!-- CONFIRM PASSWORD -->
                        <div class="mb-3">

                            <label class="form-label">
                                Confirmar contraseña
                            </label>

                            <input id="confirmPassword" type="password" name="confirmPassword" class="form-control"
                                autocomplete="new-password" required>

                        </div>

                        <!-- REGLAS -->
                        <div class="password-rules mt-2">

                            <div id="rule-length" class="rule-invalid">
                                • mínimo 8 caracteres
                            </div>

                            <div id="rule-upper" class="rule-invalid">
                                • una letra mayúscula
                            </div>

                            <div id="rule-lower" class="rule-invalid">
                                • una letra minúscula
                            </div>

                            <div id="rule-number" class="rule-invalid">
                                • un número
                            </div>

                            <div id="rule-symbol" class="rule-invalid">
                                • un símbolo
                            </div>

                            <div id="rule-match" class="rule-invalid">
                                • las contraseñas coinciden
                            </div>

                        </div>

                        <!-- BOTONES -->
                        <div class="d-flex justify-content-end gap-2 mt-3">

                            <a href="javascript:history.back()" class="btn btn-secondary">
                                Cancelar
                            </a>

                            <button id="submitBtn" type="submit" class="btn btn-primary" disabled>

                                <i class="bi bi-check-lg me-1"></i>
                                Actualizar contraseña

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script>

        const passwordInput = document.getElementById("newPassword");
        const confirmInput = document.getElementById("confirmPassword");
        const submitBtn = document.getElementById("submitBtn");

        function togglePassword() {

            const password = document.getElementById("newPassword");
            const confirm = document.getElementById("confirmPassword");
            const icon = document.getElementById("eyeIcon");

            const show = password.type === "password";

            password.type = show ? "text" : "password";
            confirm.type = show ? "text" : "password";

            icon.classList.toggle("bi-eye");
            icon.classList.toggle("bi-eye-slash");

        }

        function toggleRule(id, valid) {

            const el = document.getElementById(id);

            if (valid) {
                el.classList.add("rule-valid");
                el.classList.remove("rule-invalid");
            } else {
                el.classList.add("rule-invalid");
                el.classList.remove("rule-valid");
            }

        }

        function validatePassword() {

            const value = passwordInput.value;

            const length = value.length >= 8;
            const upper = /[A-Z]/.test(value);
            const lower = /[a-z]/.test(value);
            const number = /[0-9]/.test(value);
            const symbol = /[@$!%*?&._-]/.test(value);
            const match = value === confirmInput.value && value.length > 0;

            toggleRule("rule-length", length);
            toggleRule("rule-upper", upper);
            toggleRule("rule-lower", lower);
            toggleRule("rule-number", number);
            toggleRule("rule-symbol", symbol);
            toggleRule("rule-match", match);

            const valid =
                length &&
                upper &&
                lower &&
                number &&
                symbol &&
                match;

            submitBtn.disabled = !valid;

        }

        passwordInput.addEventListener("input", validatePassword);
        confirmInput.addEventListener("input", validatePassword);

    </script>

</section>

</html>
