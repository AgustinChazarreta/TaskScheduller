<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Recuperar contraseña | Functions Planner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" media="print"
        onload="this.media='all'">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/adminlte.css">

    <style>
        body.login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Source Sans 3', sans-serif;

            background:
                radial-gradient(circle at 20% 30%, rgba(217, 83, 79, 0.08), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(217, 83, 79, 0.08), transparent 40%),
                linear-gradient(135deg, #f8f9fa, #e9eff5);
        }

        .login-box {
            width: 380px;
        }

        .card {
            border-radius: 22px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(0, 0, 0, 0.05);

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.10),
                0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 1.4rem;
        }

        .login-logo span {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: .4px;
            color: #d9534f;
        }

        .login-card-body {
            padding: 2rem;
        }

        .login-box-msg {
            text-align: center;
            margin-bottom: 1.4rem;
            color: #555;
        }

        .form-control {
            border-radius: 12px;
        }

        .input-group-text {
            background: #f8f9fa;
            border-radius: 12px;
        }

        .form-control:focus {
            border-color: #d9534f;
            box-shadow: 0 0 0 3px rgba(217, 83, 79, 0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, #d9534f, #c12e2a);
            border: none;
            border-radius: 12px;
            font-weight: 600;
        }

        a {
            text-decoration: none;
            font-weight: 500;
            color: #d9534f;
        }

        a:hover {
            color: #c12e2a;
        }
    </style>
</head>

<body class="login-page">

    <div class="login-box">

        <div class="login-logo">
            <span>
                <i class="bi bi-calendar-check me-2"></i>
                Functions Planner
            </span>
        </div>

        <div class="card">

            <div class="card-body login-card-body">

                <p class="login-box-msg mb-0">
                    Ingresa tu correo para recuperar tu contraseña
                </p>

                <!-- MENSAJE ÉXITO -->
                <div th:if="${message}" class="alert alert-success text-center">
                    <span th:text="${message}"></span>
                    <p class="mt-2 mb-0" id="countdown">
                        Redirigiendo en 5 segundos...
                    </p>
                </div>

                <form method="post" action="/forgot-password">

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <!-- USERNAME -->
                    <div class="input-group mb-3">

                        <input type="email" name="email" class="form-control" placeholder="Correo electrónico" required>

                        <div class="input-group-text">
                            <span class="bi bi-person-fill"></span>
                        </div>

                    </div>

                    <button class="btn btn-primary w-100" id="submitBtn">

                        <span id="btnText">
                            Enviar enlace de recuperación
                        </span>

                        <span id="btnLoader" class="spinner-border spinner-border-sm d-none">
                        </span>

                    </button>

                </form>

                <div class="text-center mt-3">

                    <a href="/login">
                        Volver al login
                    </a>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js"></script>

    <script th:if="${message}">

        let time = 5;

        const countdown = setInterval(function () {

            time--;

            document.getElementById("countdown").innerText =
                "Redirigiendo en " + time + " segundos...";

            if (time <= 0) {

                clearInterval(countdown);

                window.location.href = "/login";

            }

        }, 1000);

    </script>

    <script>

        document.querySelector("form").addEventListener("submit", () => {

            document.getElementById("btnText").classList.add("d-none");
            document.getElementById("btnLoader").classList.remove("d-none");

            document.getElementById("submitBtn").disabled = true;

        });

    </script>

</body>

</html>
