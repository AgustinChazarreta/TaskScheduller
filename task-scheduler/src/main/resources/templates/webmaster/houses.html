<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::section})}">

<section>

    <div id="alertContainer" class="container-fluid mt-3"></div>

    <main class="container-fluid py-4">

        <!-- HEADER -->
        <div class="bg-white rounded-4 shadow-sm p-4 mb-4 border-soft">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="fw-bold mb-1">
                        <i class="bi bi-houses text-primary me-2"></i>
                        Gestión de Houses
                    </h2>
                    <small class="text-muted">Administrar estructuras del sistema</small>
                </div>
                <button class="btn btn-primary rounded-pill px-4" data-bs-toggle="modal"
                    data-bs-target="#createHouseModal">
                    <i class="bi bi-plus-lg me-2"></i> Nueva House
                </button>
            </div>
        </div>

        <!-- TABLA -->
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table align-middle mb-0 table-hover" id="housesTable">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Nombre</th>
                                <th>Estado</th>
                                <th>Fecha de creación</th>
                                <th class="text-end pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="housesTableBody">
                            <!-- Se inyectan houses con JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- MODAL CREAR HOUSE -->
    <div class="modal fade" id="createHouseModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow-lg">

                <!-- HEADER -->
                <div class="modal-header border-0 pb-2 bg-primary bg-opacity-10 rounded-top-4">
                    <div class="d-flex align-items-center gap-3">

                        <div class="rounded-circle bg-primary d-flex align-items-center justify-content-center"
                            style="width:48px;height:48px;">
                            <i class="bi bi-plus-circle text-white fs-5"></i>
                        </div>

                        <div>
                            <h5 class="modal-title fw-bold mb-0 text-primary">
                                Nueva House
                            </h5>
                            <small class="text-muted">
                                Cree una nueva house con sus propiedades
                            </small>
                        </div>

                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <!-- BODY -->
                <div class="modal-body pt-4">

                    <form id="createHouseForm">
                        <div id="createHouseAlertContainer"></div>

                        <div class="card border-primary border-opacity-25 bg-light-subtle rounded-4 p-3 mb-3">

                            <div class="mb-3">
                                <label class="form-label fw-semibold text-primary">Nombre</label>
                                <input type="text" name="name" class="form-control rounded-3" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold text-primary">Estado</label>
                                <select name="active" class="form-select rounded-3">
                                    <option value="true">Activa</option>
                                    <option value="false">Inactiva</option>
                                </select>
                            </div>

                        </div>

                        <!-- FOOTER -->
                        <div class="modal-footer border-0 justify-content-center pt-3">
                            <button type="button" class="btn btn-outline-secondary rounded-pill px-4"
                                data-bs-dismiss="modal">
                                Cancelar
                            </button>
                            <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm">
                                <i class="bi bi-check-lg me-1"></i>
                                Crear
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- MODAL CONFIRMAR ELIMINAR -->
    <div class="modal fade" id="deleteHouseModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title"><i class="bi bi-exclamation-triangle me-2"></i> Confirmar Eliminación</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <p id="deleteHouseMessage" class="fs-5">¿Seguro que desea eliminar <strong>NombreHouse</strong>?</p>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-secondary rounded-pill px-4"
                        data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger rounded-pill px-4"
                        id="confirmDeleteBtn">Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tableBody = document.getElementById("housesTableBody");
        const adminsContainer = document.getElementById("adminsContainer");
        let houseIdToDelete = null;
        let houseNameToDelete = "";

        // ================= ALERT =================
        function showAlert(message, type = "success") {
            const container = document.getElementById("alertContainer");
            const alert = document.createElement("div");

            let iconHtml = '';
            if (type === "success") iconHtml = '<i class="bi bi-check-circle-fill me-2"></i>';
            else if (type === "danger") iconHtml = '<i class="bi bi-x-circle-fill me-2"></i>';

            alert.className = `alert alert-${type} alert-dismissible fade show d-flex align-items-center`;
            alert.innerHTML = `${iconHtml}${message}<button class="btn-close ms-auto" data-bs-dismiss="alert"></button>`;
            container.appendChild(alert);

            setTimeout(() => alert.remove(), 6000);
        }

        // ================= LOAD HOUSES =================
        async function loadHouses() {
            tableBody.innerHTML = "";
            try {
                const res = await fetch("/api/webmaster/houses");
                if (!res.ok) throw new Error("Error al cargar houses");

                const houses = await res.json();

                if (houses.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="4" class="text-center py-5 text-muted">No hay houses registradas.</td></tr>`;
                    return;
                }

                houses.forEach(house => {
                    const row = document.createElement("tr");

                    row.innerHTML = `
<td class="ps-4 fw-semibold">${house.name}</td>

<td>
<span class="badge ${house.active ? "bg-success-subtle text-success" : "bg-secondary-subtle text-secondary"}">
${house.active ? "Activa" : "Inactiva"}
</span>
</td>

<td>
<div class="fw-semibold">
${new Date(house.createdAt).toLocaleDateString("es-AR", { day: "2-digit", month: "long", year: "numeric" })}
</div>

<small class="text-muted">
${new Date(house.createdAt).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })} hs
</small>
</td>

<td class="text-end pe-4">

<button class="btn btn-sm btn-outline-secondary rounded-circle me-2"
onclick="showEditHouseModal(${house.id}, '${house.name}', ${house.active})">
<i class="bi bi-pencil"></i>
</button>

<button class="btn btn-sm btn-outline-danger rounded-circle me-2"
onclick="showDeleteHouseModal(${house.id}, '${house.name}')">
<i class="bi bi-trash"></i>
</button>

<a href="/webmaster/houses/${house.id}/admins"
class="btn btn-sm btn-outline-primary rounded-pill me-2">
    <i class="bi bi-gear-fill me-1"></i> Admins
</a>

<button
    class="btn btn-sm btn-success rounded-pill"
    onclick="enterAsAdmin(${house.id})">
    <i class="bi bi-box-arrow-in-right me-1"></i>
    Ingresar
</button>

</td>
`;

                    tableBody.appendChild(row);
                });

            } catch (err) {

                tableBody.innerHTML = `
<tr>
<td colspan="4" class="text-danger text-center py-5">
No se pudieron cargar las houses
</td>
</tr>
`;

                console.error(err);
            }
        }

        // ================= CREATE HOUSE =================
        document.getElementById("createHouseForm").addEventListener("submit", async e => {

            e.preventDefault();

            const data = new FormData(e.target);
            const name = data.get("name");

            const body = {
                name: name,
                active: data.get("active") === "true"
            };

            try {

                const res = await fetch("/api/webmaster/houses", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body)
                });

                if (!res.ok) throw new Error("Error al crear house");

                showAlert(`House&nbsp;<strong>${name}</strong>&nbsp;creada correctamente`);

                e.target.reset();

                const modal = bootstrap.Modal.getInstance(document.getElementById("createHouseModal"));
                if (modal) modal.hide();

                loadHouses();

            } catch (err) {

                console.error(err);

                const modal = bootstrap.Modal.getInstance(document.getElementById("createHouseModal"));
                if (modal) modal.hide();

                showAlert(`La house&nbsp;<strong>${name}</strong>&nbsp;ya existe`, "danger");
            }
        });

        // ================= EDIT HOUSE =================
        function showEditHouseModal(id, name, active) {

            const modalHtml = `
<div class="modal fade" id="editHouseModal">
<div class="modal-dialog modal-dialog-centered">

<div class="modal-content shadow">

<div class="modal-header bg-primary text-white">
<h5 class="modal-title">
<i class="bi bi-pencil me-2"></i> Editar House
</h5>

<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">

<form id="editHouseForm">

<div class="mb-3">
<label class="form-label fw-semibold">Nombre</label>
<input type="text" name="name" value="${name}" class="form-control rounded-3" required>
</div>

<div class="mb-3">
<label class="form-label fw-semibold">Estado</label>

<select name="active" class="form-select rounded-3">

<option value="true" ${active ? "selected" : ""}>Activa</option>
<option value="false" ${!active ? "selected" : ""}>Inactiva</option>

</select>

</div>

<div class="text-end">

<button type="button"
class="btn btn-secondary rounded-pill px-3 me-2"
data-bs-dismiss="modal">
Cancelar
</button>

<button type="submit"
class="btn btn-primary rounded-pill px-4">
Guardar Cambios
</button>

</div>

</form>

</div>
</div>
</div>
</div>
`;

            document.body.insertAdjacentHTML("beforeend", modalHtml);

            const modalEl = document.getElementById("editHouseModal");
            const modal = new bootstrap.Modal(modalEl);

            modal.show();

            document.getElementById("editHouseForm").addEventListener("submit", async e => {

                e.preventDefault();

                const formData = new FormData(e.target);
                const newName = formData.get("name");

                const body = {
                    name: newName,
                    active: formData.get("active") === "true"
                };

                try {

                    const res = await fetch(`/api/webmaster/houses/${id}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(body)
                    });

                    if (!res.ok) throw new Error("Error al actualizar house");

                    showAlert(`House&nbsp;<strong>${newName}</strong>&nbsp;actualizada correctamente`);

                    modal.hide();
                    modalEl.remove();

                    loadHouses();

                } catch (err) {

                    console.error(err);
                    showAlert(`No se pudo actualizar la house <strong>${newName}</strong>`, "danger");

                }

            });

            modalEl.addEventListener("hidden.bs.modal", () => modalEl.remove());

        }

        // ================= DELETE HOUSE =================
        function showDeleteHouseModal(id, name) {

            houseIdToDelete = id;
            houseNameToDelete = name;

            document.getElementById("deleteHouseMessage").innerHTML =
                `¿Seguro que desea eliminar <strong>${name}</strong>?`;

            const modalEl = document.getElementById("deleteHouseModal");
            const modal = new bootstrap.Modal(modalEl);

            modal.show();
        }

        async function enterAsAdmin(houseId) {

            const response = await fetch(`/api/impersonation/house/${houseId}`, {
                method: "POST"
            });

            if (response.ok) {

                window.location.href = "/admin/dashboard";

            } else {

                console.error("Error entrando como admin");

            }
        }
        document.getElementById("confirmDeleteBtn").addEventListener("click", async () => {

            if (!houseIdToDelete) return;

            try {

                const res = await fetch(`/api/webmaster/houses/${houseIdToDelete}`, {
                    method: "DELETE"
                });

                if (!res.ok) throw new Error("Error al eliminar house");

                showAlert(`House&nbsp;<strong>${houseNameToDelete}</strong>&nbsp;eliminada correctamente`);

                loadHouses();

            } catch (err) {

                console.error(err);
                showAlert(`No se pudo eliminar la house&nbsp;<strong>${houseNameToDelete}</strong>&nbsp;`, "danger");

            }

            bootstrap.Modal.getInstance(document.getElementById("deleteHouseModal")).hide();

            houseIdToDelete = null;
            houseNameToDelete = "";

        });

        // ================= INIT =================
        loadHouses();

    </script>

</section>

</html>
