<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:replace="~{layout/main :: layout(~{::section})}">

<section>

    <main class="container-fluid py-4">

        <!-- HEADER -->
        <div class="bg-white rounded-4 shadow-sm p-4 mb-4 border-soft">
            <div class="d-flex justify-content-between align-items-center">

                <div>
                    <h2 class="fw-bold mb-1">
                        <i class="bi bi-houses text-primary me-2"></i>
                        Gestión de Houses
                    </h2>
                    <small class="text-muted">
                        Administrar estructuras del sistema
                    </small>
                </div>

                <button class="btn btn-primary rounded-pill px-4" data-bs-toggle="modal"
                    data-bs-target="#createHouseModal">
                    <i class="bi bi-plus-lg me-2"></i>
                    Nueva House
                </button>
            </div>
        </div>


        <!-- TABLA -->
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-0">

                <div class="table-responsive">
                    <table class="table align-middle mb-0 table-hover">

                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Nombre</th>
                                <th>Estado</th>
                                <th>Fecha de creación</th>
                                <th class="text-end pe-4">Acciones</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr th:each="house : ${houses}">
                                <td class="ps-4 fw-semibold" th:text="${house.name}"></td>
                                <td>
                                    <span class="badge bg-success-subtle text-success" th:if="${house.active}">
                                        Activa
                                    </span>

                                    <span class="badge bg-secondary-subtle text-secondary" th:if="${!house.active}">
                                        Inactiva
                                    </span>
                                </td>

                                <td>
                                    <div class="fw-semibold"
                                        th:text="${#temporals.format(house.createdAt, 'dd ''de'' MMMM yyyy')}">
                                    </div>
                                    <small class="text-muted"
                                        th:text="${#temporals.format(house.createdAt, 'HH:mm')} + ' hs'">
                                    </small>
                                </td>
                                <td class="text-end pe-4">

                                    <!-- EDIT -->
                                    <button class="btn btn-sm btn-outline-secondary rounded-circle me-2"
                                        data-bs-toggle="modal" th:data-bs-target="'#editModal-' + ${house.id}">
                                        <i class="bi bi-pencil"></i>
                                    </button>

                                    <!-- DELETE -->
                                    <button class="btn btn-sm btn-outline-danger rounded-circle me-2"
                                        data-bs-toggle="modal" th:data-bs-target="'#deleteModal-' + ${house.id}">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                    </form>

                                    <!-- ADMIN MANAGEMENT -->
                                    <a th:href="@{/webmaster/houses/{id}/admins(id=${house.id})}"
                                        class="btn btn-sm btn-outline-primary rounded-pill me-2">
                                        <i class="bi bi-gear-fill me-1"></i>
                                        Admins
                                    </a>
                                </td>
                            </tr>

                            <!-- EMPTY -->
                            <tr th:if="${#lists.isEmpty(houses)}">
                                <td colspan="4" class="text-center py-5 text-muted">
                                    No hay houses registradas.
                                </td>
                            </tr>

                        </tbody>

                    </table>
                </div>

            </div>
        </div>

    </main>


    <!-- MODAL CREAR -->
    <div class="modal fade" id="createHouseModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 shadow border-0">

                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">
                        <i class="bi bi-plus-circle me-2"></i>
                        Nueva House
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form th:action="@{/webmaster/houses/create}" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre</label>
                            <input type="text" name="name" class="form-control rounded-3" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Estado</label>
                            <select name="active" class="form-select rounded-3">
                                <option value="true">Activa</option>
                                <option value="false">Inactiva</option>
                            </select>
                        </div>

                        <div class="text-end pt-2">
                            <button type="button" class="btn btn-secondary rounded-pill px-3 me-2"
                                data-bs-dismiss="modal">
                                Cancelar
                            </button>
                            <button class="btn btn-primary rounded-pill px-4">
                                Crear
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>


    <!-- MODAL EDIT HOUSE -->
    <div th:each="house : ${houses}" class="modal fade" th:id="'editModal-' + ${house.id}" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow">

                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">
                        <i class="bi bi-pencil me-2"></i>
                        Editar House
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form th:action="@{/webmaster/houses/edit/{id}(id=${house.id})}" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre</label>
                            <input type="text" name="name" th:value="${house.name}" class="form-control rounded-3"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Estado</label>
                            <select name="active" class="form-select rounded-3">
                                <option value="true" th:selected="${house.active}">Activa</option>
                                <option value="false" th:selected="${!house.active}">Inactiva</option>
                            </select>
                        </div>

                        <div class="modal-footer justify-content-center">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                Cancelar
                            </button>
                            <button type="submit" class="btn btn-primary">
                                Guardar Cambios
                            </button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- MODAL DELETE HOUSE -->
    <div th:each="house : ${houses}" class="modal fade" th:id="'deleteModal-' + ${house.id}" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow">

                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Eliminar House
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body text-center">
                    <p class="mb-0 fs-5">
                        ¿Seguro que desea eliminar <span class="fw-semibold" th:text="${house.name}"></span>?
                    </p>
                </div>

                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <form th:action="@{/webmaster/houses/delete/{id}(id=${house.id})}" method="post">
                        <button type="submit" class="btn btn-danger">
                            Eliminar
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>

</section>

</html>
