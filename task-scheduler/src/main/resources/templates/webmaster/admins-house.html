<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:replace="~{layout/main :: layout(~{::section})}">

<section>
    <main class="container-fluid py-4">

        <!-- HEADER -->
        <div class="bg-white rounded-4 shadow-sm p-4 mb-4 border-soft">
            <div class="d-flex justify-content-between align-items-center">

                <div>
                    <h2 class="fw-bold mb-1">
                        <i class="bi bi-people text-primary me-2"></i>
                        Gestión de Administradores de <span th:text="${house.name}">House</span>
                    </h2>
                </div>

                <button class="btn btn-primary rounded-pill px-4" data-bs-toggle="modal"
                    data-bs-target="#createAdminModal">
                    <i class="bi bi-plus-lg me-2"></i>
                    Nuevo Admin
                </button>

            </div>
        </div>

        <!-- TABLA ADMINS -->
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-0">
                <div th:if="${#lists.isEmpty(admins)}" class="p-3 text-center text-muted">
                    <i class="bi bi-person-x fs-2 mb-2"></i>
                    <p class="mb-0">No hay administradores creados para esta house.</p>
                </div>

                <div th:if="${!#lists.isEmpty(admins)}" class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Nombre</th>
                                <th>Estado</th>
                                <th>Fecha de creación</th>
                                <th class="text-end pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="admin : ${admins}">
                                <td class="ps-4 fw-semibold" th:text="${admin.username}"></td>
                                <td>
                                    <span class="badge bg-success-subtle text-success"
                                        th:if="${admin.active}">Activo</span>
                                    <span class="badge bg-secondary-subtle text-secondary"
                                        th:if="${!admin.active}">Inactivo</span>
                                </td>
                                <td>
                                    <div class="fw-semibold"
                                        th:text="${#temporals.format(admin.createdAt, 'dd ''de'' MMMM yyyy')}"></div>
                                    <small class="text-muted"
                                        th:text="${#temporals.format(admin.createdAt, 'HH:mm')} + ' hs'"></small>
                                </td>
                                <td class="text-end pe-4">
                                    <!-- EDIT -->
                                    <button class="btn btn-sm btn-outline-secondary rounded-circle me-2"
                                        data-bs-toggle="modal" th:data-bs-target="'#editModal-' + ${admin.id}">
                                        <i class="bi bi-pencil"></i>
                                    </button>

                                    <!-- DELETE -->
                                    <button class="btn btn-sm btn-outline-danger rounded-circle" data-bs-toggle="modal"
                                        th:data-bs-target="'#deleteModal-' + ${admin.id}">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- MODAL CREAR ADMIN -->
    <div class="modal fade" id="createAdminModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 shadow border-0">

                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">
                        <i class="bi bi-person-plus-fill me-2"></i>
                        Nuevo Admin
                    </h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form th:action="@{/webmaster/houses/{id}/admins/create(id=${house.id})}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Username</label>
                            <input type="text" name="username" class="form-control rounded-3"
                                placeholder="Ej: admin_central" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" name="password" class="form-control rounded-3"
                                placeholder="Contraseña segura" required>
                        </div>

                        <div class="text-end pt-2">
                            <button type="button" class="btn btn-secondary rounded-pill px-3 me-2"
                                data-bs-dismiss="modal">
                                Cancelar
                            </button>
                            <button class="btn btn-primary rounded-pill px-4">
                                Crear
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL EDIT ADMIN -->
    <div th:each="admin : ${admins}" class="modal fade" th:id="'editModal-' + ${admin.id}" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow">

                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">
                        <i class="bi bi-pencil me-2"></i>
                        Editar Admin
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form th:action="@{/webmaster/admins/edit/{id}(id=${admin.id})}" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Username</label>
                            <input type="text" name="username" th:value="${admin.username}"
                                class="form-control rounded-3" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Estado</label>
                            <select name="active" class="form-select rounded-3">
                                <option value="true" th:selected="${admin.active}">Activo</option>
                                <option value="false" th:selected="${!admin.active}">Inactivo</option>
                            </select>
                        </div>

                        <div class="modal-footer justify-content-center">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- MODAL DELETE ADMIN -->
    <div th:each="admin : ${admins}" class="modal fade" th:id="'deleteModal-' + ${admin.id}" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow">

                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Eliminar Admin
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body text-center">
                    <p class="mb-0 fs-5">
                        ¿Seguro que desea eliminar a <span class="fw-semibold" th:text="${admin.username}"></span>?
                    </p>
                </div>

                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <form th:action="@{/webmaster/admins/delete/{id}(id=${admin.id})}" method="post">
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                    </form>
                </div>

            </div>
        </div>
    </div>

</section>

</html>
