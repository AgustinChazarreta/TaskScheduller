<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::section})}">

<section>

    <div id="alertContainer" class="container-fluid mt-3"></div>

    <main class="container-fluid py-4">

        <!-- HEADER -->
        <div class="bg-white rounded-4 shadow-sm p-4 mb-4 border-soft">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="fw-bold mb-1">
                        <i class="bi bi-people text-primary me-2"></i>
                        Gestión de Administradores de <span id="houseName">Cargando...</span>
                    </h2>
                </div>
                <button class="btn btn-primary rounded-pill px-4" data-bs-toggle="modal"
                    data-bs-target="#createAdminModal">
                    <i class="bi bi-plus-lg me-2"></i> Nuevo Admin
                </button>
            </div>
        </div>

        <!-- TABLA ADMINS -->
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table align-middle mb-0 table-hover" id="adminsTable">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Nombre</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>House</th>
                                <th>Orden</th>
                                <th>Fecha de creación</th>
                                <th class="text-end pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="adminsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- MODAL CREAR ADMIN -->
        <div class="modal fade" id="createAdminModal">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content rounded-4 shadow border-0">

                    <form id="createAdminForm">

                        <!-- HEADER -->
                        <div class="modal-header border-0 pb-2 bg-primary bg-opacity-10 rounded-top-4">
                            <div class="d-flex align-items-center gap-3">
                                <div class="rounded-circle bg-primary d-flex align-items-center justify-content-center"
                                    style="width:48px;height:48px;">
                                    <i class="bi bi-person-plus text-white fs-5"></i>
                                </div>
                                <div>
                                    <h5 class="modal-title fw-bold mb-0 text-primary">
                                        Crear administrador
                                    </h5>
                                    <small class="text-muted">
                                        Complete los datos del nuevo admin
                                    </small>
                                </div>
                            </div>

                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <!-- BODY -->
                        <div class="modal-body pt-4">

                            <div class="card border-primary border-opacity-25 bg-light-subtle rounded-4 p-3 mb-3">

                                <div class="mb-2">
                                    <label class="form-label fw-semibold text-primary">Nombre y Apellido</label>
                                    <input type="text" id="newAdminName" class="form-control rounded-3"
                                        placeholder="ej: Juan Pérez" required>
                                </div>

                                <div class="mb-2">
                                    <label class="form-label fw-semibold text-primary">Correo Electrónico</label>
                                    <input type="email" id="newAdminUsername" class="form-control rounded-3"
                                        placeholder="ej: admin.juan@gmail.com" required>
                                </div>

                                <div class="mb-2">
                                    <label class="form-label fw-semibold text-primary">Orden</label>
                                    <select id="newAdminOrden" class="form-select rounded-3">
                                        <option value="">Sin orden</option>
                                        <option value="ORDEN_I">Orden I</option>
                                        <option value="ORDEN_II">Orden II</option>
                                    </select>
                                </div>

                                <div class="mb-2">
                                    <label class="form-label fw-semibold text-primary">Sede de Residencia</label>
                                    <input type="text" id="newAdminSede" class="form-control rounded-3"
                                        placeholder="Ej: Buenos Aires" required>
                                </div>

                                <div class="mb-2">
                                    <label class="form-label fw-semibold text-primary">Encargado</label>
                                    <input type="text" id="newAdminEncargado" class="form-control rounded-3"
                                        placeholder="Nombre del encargado">
                                </div>

                            </div>
                        </div>

                        <!-- FOOTER -->
                        <div class="modal-footer border-0 justify-content-center pt-3">
                            <button type="button" class="btn btn-outline-secondary rounded-pill px-4"
                                data-bs-dismiss="modal">
                                Cancelar
                            </button>

                            <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm">
                                <i class="bi bi-plus-lg me-1"></i>
                                Crear
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>

        <!-- MODAL ELIMINAR ADMIN -->
        <div class="modal fade" id="deleteAdminModal">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content shadow">
                    <div class="modal-header bg-danger text-white">
                        <h5 class="modal-title">
                            <i class="bi bi-exclamation-triangle me-2"></i>
                            Confirmar Eliminación
                        </h5>
                        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body text-center">
                        <p id="deleteAdminMessage" class="fs-5"></p>
                    </div>
                    <div class="modal-footer justify-content-center">
                        <button class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">
                            Cancelar
                        </button>
                        <button class="btn btn-danger rounded-pill px-4" id="confirmDeleteAdminBtn">
                            Eliminar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- MODAL EDITAR ADMIN -->
        <div class="modal fade" id="editAdminModal">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content rounded-4 shadow border-0">

                    <form id="editAdminForm">

                        <!-- HEADER -->
                        <div class="modal-header border-0 pb-2 bg-primary bg-opacity-10 rounded-top-4">
                            <div class="d-flex align-items-center gap-3">
                                <div class="rounded-circle bg-primary d-flex align-items-center justify-content-center"
                                    style="width:48px;height:48px;">
                                    <i class="bi bi-pencil text-white fs-5"></i>
                                </div>
                                <div>
                                    <h5 class="modal-title fw-bold mb-0 text-primary">
                                        Editar administrador
                                    </h5>
                                    <small class="text-muted">
                                        Modifique los datos del administrador
                                    </small>
                                </div>
                            </div>

                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <!-- BODY -->
                        <div class="modal-body pt-4">

                            <input type="hidden" id="editAdminId">

                            <div class="card border-primary border-opacity-25 bg-light-subtle rounded-4 p-3 mb-3">

                                <div class="mb-3">
                                    <label class="form-label fw-semibold text-primary">Nombre</label>
                                    <input type="text" id="editAdminName" class="form-control rounded-3">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold text-primary">Email / Username</label>
                                    <input type="text" id="editAdminUsername" class="form-control rounded-3" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold text-primary">Orden</label>
                                    <select id="editAdminOrden" class="form-select rounded-3" required>
                                        <option value="ORDEN_I">Orden I</option>
                                        <option value="ORDEN_II">Orden II</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold text-primary">Sede</label>
                                    <input type="text" id="editAdminSede" class="form-control rounded-3">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold text-primary">Encargado</label>
                                    <input type="text" id="editAdminEncargado" class="form-control rounded-3">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold text-primary">Estado</label>
                                    <select id="editAdminActive" class="form-select rounded-3">
                                        <option value="true">Activo</option>
                                        <option value="false">Inactivo</option>
                                    </select>
                                </div>

                            </div>
                        </div>

                        <!-- FOOTER -->
                        <div class="modal-footer border-0 justify-content-center pt-3">
                            <button type="button" class="btn btn-outline-secondary rounded-pill px-4"
                                data-bs-dismiss="modal">
                                Cancelar
                            </button>

                            <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm">
                                <i class="bi bi-save me-1"></i>
                                Guardar cambios
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>

    </main>

    <!-- MODALES (SIN CAMBIOS) -->
    <!-- CREATE + DELETE igual que tu código original -->

    <script>
        const houseId = window.location.pathname.split('/')[3];
        const tableBody = document.getElementById("adminsTableBody");
        const houseNameSpan = document.getElementById("houseName");

        const adminsCache = {};

        let adminIdToDelete = null;
        let adminUsernameToDelete = "";

        // ================= ALERT =================
        function showAlert(message, type = "success", showIcon = true, duration = 3000) {
            const container = document.getElementById("alertContainer");
            const alert = document.createElement("div");

            let iconHtml = '';
            if (showIcon) {
                if (type === "success") iconHtml = '<i class="bi bi-check-circle-fill me-2"></i>';
                else if (type === "danger") iconHtml = '<i class="bi bi-x-circle-fill me-2"></i>';
            }

            alert.className = `alert alert-${type} alert-dismissible fade show rounded-4 shadow`;
            alert.role = "alert";
            alert.innerHTML = `${iconHtml}${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    `;
            container.appendChild(alert);

            setTimeout(() => {
                bootstrap.Alert.getOrCreateInstance(alert).close();
            }, duration);
        }

        // ================= LOAD ADMINS =================
        async function loadAdmins() {

            tableBody.innerHTML = "";

            try {

                const houseRes = await fetch(`/api/webmaster/houses/${houseId}`);
                const house = await houseRes.json();
                houseNameSpan.textContent = house.name;

                const res = await fetch(`/api/webmaster/admins/houses/${houseId}`);
                if (!res.ok) throw new Error("Error al cargar admins");

                const admins = await res.json();

                if (admins.length === 0) {
                    tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center py-5 text-muted">
                            No hay administradores creados para esta casa.
                        </td>
                    </tr>`;
                    return;
                }

                admins.forEach(admin => {

                    // 🔥 cache igual que users.js
                    const adminId = admin.id || admin.adminId;
                    adminsCache[adminId] = admin;

                    const adminData = admin.adminData || {};

                    const name = adminData.nombre || admin.username;

                    const dateObj = new Date(admin.createdAt);
                    const date = dateObj.toLocaleDateString("es-AR", {
                        day: "2-digit",
                        month: "long",
                        year: "numeric"
                    });
                    const time = dateObj.toLocaleTimeString("es-AR", {
                        hour: "2-digit",
                        minute: "2-digit"
                    });

                    const activeBadge = admin.active
                        ? `<span class="badge bg-success-subtle text-success">Activo</span>`
                        : `<span class="badge bg-danger-subtle text-danger">Inactivo</span>`;

                    const row = document.createElement("tr");

                    row.innerHTML = `
                    <td class="ps-4 fw-semibold">${name}</td>

                    <td>
                        <span class="badge bg-primary-subtle text-primary">
                            Admin
                        </span>
                    </td>

                    <td>${activeBadge}</td>

                    <td>
                        <span class="badge bg-info-subtle text-dark">
                            ${house.name}
                        </span>
                    </td>

                    <td>
                        <span class="badge bg-secondary-subtle text-dark">
                            ${formatOrden(adminData.orden)}
                        </span>
                    </td>

                    <td>
                        <div class="fw-semibold">${date}</div>
                        <small class="text-muted">${time} hs</small>
                    </td>

                    <td class="text-end pe-4">

                        <button class="btn btn-sm btn-outline-secondary rounded-circle me-2"
                            onclick="openEditAdminModal(${adminId})">
                            <i class="bi bi-pencil"></i>
                        </button>

                        <button class="btn btn-sm btn-outline-danger rounded-circle"
                            onclick="openDeleteAdminModal(${adminId})">
                            <i class="bi bi-trash"></i>
                        </button>

                    </td>
                `;

                    tableBody.appendChild(row);
                });

            } catch (err) {

                console.error(err);

                tableBody.innerHTML = `
                <tr>
                    <td colspan="7" class="text-danger text-center py-5">
                        No se pudieron cargar los administradores
                    </td>
                </tr>`;
            }
        }

        // ================= CREATE ADMIN =================
        document.getElementById("createAdminForm").addEventListener("submit", async e => {
            e.preventDefault();

            const nombre = document.getElementById("newAdminName").value.trim();
            const email = document.getElementById("newAdminUsername").value.trim();
            const orden = document.getElementById("newAdminOrden").value || null;
            const sede = document.getElementById("newAdminSede").value.trim() || "";
            const encargado = document.getElementById("newAdminEncargado").value.trim() || "";

            const submitBtn = e.target.querySelector("button[type='submit']");
            submitBtn.disabled = true;

            const originalContent = submitBtn.innerHTML;

            submitBtn.innerHTML = `
        <span class="spinner-border spinner-border-sm me-2"></span>
        Creando...
    `;

            const payload = {
                nombre,
                email,
                password: null,
                orden,
                sedeResidencia: sede,
                encargado
            };

            try {

                const res = await fetch(`/api/webmaster/admins/houses/${houseId}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {

                    let errorMessage = "No se pudo crear el admin";

                    try {
                        const errData = await res.json();
                        errorMessage =
                            errData.details?.[0] ||
                            errData.message ||
                            errorMessage;
                    } catch {
                        const text = await res.text();
                        if (text) errorMessage = text;
                    }

                    throw new Error(errorMessage);
                }

                const data = await res.json();

                bootstrap.Modal.getInstance(
                    document.getElementById("createAdminModal")
                ).hide();

                loadAdmins();

                showAlert(`
            <i class="bi bi-check-circle-fill me-2"></i>
            Administrador <strong>${data.adminData?.nombre || data.username}</strong> creado correctamente.
            <br><small>Se envió un correo con la contraseña temporal</small>
        `, "success", false, 5000);

                // limpiar form
                e.target.reset();

            } catch (err) {
                showAlert(err.message, "danger");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalContent;
            }
        });

        // ================= DELETE =================
        window.openDeleteAdminModal = function (id) {

            const admin = adminsCache[id];

            adminIdToDelete = id;
            adminUsernameToDelete = admin.adminData?.nombre || admin.username;

            document.getElementById("deleteAdminMessage").innerHTML =
                `¿Seguro que desea eliminar <strong>${adminUsernameToDelete}</strong>?`;

            new bootstrap.Modal(document.getElementById("deleteAdminModal")).show();
        }

        // ================= EDIT =================
        window.openEditAdminModal = function (id) {

            const admin = adminsCache[id];

            if (!admin) {
                showAlert("No se pudo cargar el admin", "danger");
                return;
            }

            const adminData = admin.adminData || {};

            document.getElementById("editAdminId").value = admin.id || admin.adminId;
            document.getElementById("editAdminName").value = adminData.nombre || "";
            document.getElementById("editAdminUsername").value = admin.username;
            document.getElementById("editAdminOrden").value = adminData.orden || "";
            document.getElementById("editAdminSede").value = adminData.sedeResidencia || "";
            document.getElementById("editAdminEncargado").value = adminData.encargado || "";
            document.getElementById("editAdminActive").value = admin.active;

            bootstrap.Modal.getOrCreateInstance(document.getElementById("editAdminModal")).show();
        };

        function formatOrden(orden) {
            if (!orden) return "-";
            const words = orden.replace(/_/g, " ").split(" ");
            words[0] = words[0].charAt(0).toUpperCase() + words[0].slice(1).toLowerCase();
            if (words[1]) words[1] = words[1].toUpperCase();
            return words.join(" ");
        }

        // ================= CONFIRM DELETE =================
        document.getElementById("confirmDeleteAdminBtn").addEventListener("click", async () => {

            if (!adminIdToDelete) return;

            const modalEl = document.getElementById("deleteAdminModal");
            const modalInstance = bootstrap.Modal.getOrCreateInstance(modalEl);

            try {

                const admin = adminsCache[adminIdToDelete];
                if (!admin) throw new Error("Admin no encontrado");

                const res = await fetch(`/api/webmaster/admins/${adminIdToDelete}`, {
                    method: "DELETE"
                });

                if (!res.ok) {

                    let errorMessage = "No se pudo eliminar el admin";

                    try {
                        const errData = await res.json();
                        errorMessage =
                            errData.details?.[0] ||
                            errData.message ||
                            errorMessage;
                    } catch {
                        const text = await res.text();
                        if (text) errorMessage = text;
                    }

                    throw new Error(errorMessage);
                }

                loadAdmins();

                showAlert(`Admin <strong>${adminUsernameToDelete}</strong> eliminado correctamente`, "success");

            } catch (err) {
                showAlert(err.message, "danger");
            } finally {
                modalInstance.hide();
                adminIdToDelete = null;
            }
        });

        // ================= EDIT ADMIN SUBMIT =================
        document.getElementById("editAdminForm").addEventListener("submit", async e => {
            e.preventDefault();

            const id = Number(document.getElementById("editAdminId").value);

            const payload = {
                username: document.getElementById("editAdminUsername").value,
                active: document.getElementById("editAdminActive").value === "true",

                nombre: document.getElementById("editAdminName").value,
                orden: document.getElementById("editAdminOrden").value,
                sedeResidencia: document.getElementById("editAdminSede").value,
                encargado: document.getElementById("editAdminEncargado").value
            };

            const submitBtn = e.target.querySelector("button[type='submit']");
            submitBtn.disabled = true;

            const originalContent = submitBtn.innerHTML;

            submitBtn.innerHTML = `
        <span class="spinner-border spinner-border-sm me-2"></span>
        Guardando...
    `;

            try {

                const res = await fetch(`/api/webmaster/admins/${id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const text = await res.text();
                    throw new Error(text || "No se pudo editar el admin");
                }

                const data = await res.json();

                bootstrap.Modal.getInstance(document.getElementById("editAdminModal")).hide();

                loadAdmins();

                showAlert(
                    `Admin <strong>${data.adminData?.nombre || data.username}</strong> editado correctamente`,
                    "success"
                );

            } catch (err) {
                showAlert(err.message, "danger");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalContent;
            }
        });

        // ================= INIT =================
        loadAdmins();
    </script>

</section>

</html>
