<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::section})}">

<section>

    <main class="container-fluid py-4 fade-in">

        <!-- ================= HEADER ================= -->
        <div class="bg-white rounded-4 shadow-sm p-4 mb-4 border-soft header-card">
            <div class="d-flex justify-content-between align-items-center flex-wrap">
                <div>
                    <h2 class="fw-bold mb-0">
                        <i class="bi bi-bar-chart-line text-primary me-2"></i>
                        Estadísticas del Sistema
                    </h2>
                    <small class="text-muted">
                        Resumen de actividad y rendimiento del sistema
                    </small>
                </div>

                    <div class="d-flex align-items-center gap-3">

                        <select id="houseFilter" class="form-select form-select-sm shadow-sm" style="width:200px;">
                            <option value="">Todas las Houses</option>
                            <option th:each="house : ${houses}" th:value="${house.id}" th:text="${house.name}">
                            </option>
                        </select>

                    </div>
                </div>
            </div>

            <!-- ================= NO DATA ================= -->
            <div class="bg-white rounded-4 shadow-sm p-4 border-soft mb-4"
                th:if="${stats == null || stats.totalAssignments == 0}">
                <div class="d-flex flex-column justify-content-center text-center text-muted" style="min-height:50vh;">
                    <i class="bi bi-exclamation-triangle fs-1 mb-3"></i>
                    <h4>Estadísticas no disponibles</h4>
                    <p>No se han generado estadísticas del sistema aún.</p>
                </div>
            </div>

            <!-- ================= METRICS ================= -->
            <div class="row g-4 mb-4" th:if="${stats != null && stats.totalAssignments > 0}">

                <!-- TOTAL RUNS -->
                <div class="col-md-3 col-sm-6">
                    <div class="card metric-card bg-primary text-white">
                        <i class="bi bi-speedometer2 fs-3 mb-2"></i>
                        <div class="metric-label">Total Runs</div>
                        <div class="metric-value" th:text="${stats.totalRuns}">0</div>
                    </div>
                </div>

                <!-- ACTIVE RUNS -->
                <div class="col-md-3 col-sm-6">
                    <div class="card metric-card bg-success text-white">
                        <i class="bi bi-play-circle fs-3 mb-2"></i>
                        <div class="metric-label">Active Runs</div>
                        <div class="metric-value" th:text="${stats.activeRuns}">0</div>
                    </div>
                </div>

                <!-- ARCHIVED RUNS -->
                <div class="col-md-3 col-sm-6">
                    <div class="card metric-card bg-secondary text-white">
                        <i class="bi bi-archive fs-3 mb-2"></i>
                        <div class="metric-label">Archived Runs</div>
                        <div class="metric-value" th:text="${stats.archivedRuns}">0</div>
                    </div>
                </div>

                <!-- TOTAL ASSIGNMENTS -->
                <div class="col-md-3 col-sm-6">
                    <div class="card metric-card bg-warning text-dark">
                        <i class="bi bi-list-check fs-3 mb-2"></i>
                        <div class="metric-label">Total Assignments</div>
                        <div class="metric-value" th:text="${stats.totalAssignments}">0</div>
                    </div>
                </div>

            </div>

            <!-- ================= CHARTS ================= -->
            <div class="row g-4" th:if="${stats != null && stats.totalAssignments > 0}">

                <!-- PERSON CHART -->
                <div class="col-lg-6">
                    <div class="card chart-card h-100">
                        <div class="card-body">
                            <h5 class="fw-bold mb-3">Asignaciones por Persona</h5>
                            <div class="chart-wrapper">
                                <canvas id="personChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- FUNCTION CHART -->
                <div class="col-lg-6">
                    <div class="card chart-card h-100">
                        <div class="card-body">
                            <h5 class="fw-bold mb-3">Asignaciones por Función</h5>
                            <div class="chart-wrapper">
                                <canvas id="functionChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- MONTHLY CHART -->
                <div class="col-12">
                    <div class="card chart-card">
                        <div class="card-body">
                            <h5 class="fw-bold mb-3">Tendencia Mensual de Asignaciones</h5>
                            <div class="chart-wrapper">
                                <canvas id="monthlyChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

    </main>

    <!-- ================= CHART SCRIPT ================= -->
    <script th:inline="javascript" th:if="${stats != null && stats.totalAssignments > 0}">

        let personChartInstance;
        let functionChartInstance;
        let monthlyChartInstance;

        Chart.defaults.font.family = "'Inter', 'Segoe UI', sans-serif";
        Chart.defaults.plugins.tooltip.backgroundColor = "#212529";
        Chart.defaults.plugins.tooltip.padding = 12;
        Chart.defaults.plugins.tooltip.cornerRadius = 8;

        // ================= INITIAL LOAD =================

        const personLabels = /*[[${personLabels}]]*/[];
        const personValues = /*[[${personValues}]]*/[];

        personChartInstance = new Chart(document.getElementById('personChart'), {
            type: 'bar',
            data: {
                labels: personLabels,
                datasets: [{
                    data: personValues,
                    backgroundColor: '#0d6efd',
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } }
            }
        });

        const functionLabels = /*[[${functionLabels}]]*/[];
        const functionValues = /*[[${functionValues}]]*/[];

        functionChartInstance = new Chart(document.getElementById('functionChart'), {
            type: 'doughnut',
            data: {
                labels: functionLabels,
                datasets: [{
                    data: functionValues,
                    backgroundColor: [
                        '#0d6efd', '#198754', '#ffc107',
                        '#6c757d', '#fd7e14', '#0dcaf0', '#dc3545'
                    ]
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        });

        const monthLabels = /*[[${monthLabels}]]*/[];
        const monthValues = /*[[${monthValues}]]*/[];

        const formattedLabels = monthLabels.map(m => {
            const [year, month] = m.split('-');

            // month - 1 porque JS empieza en 0
            const date = new Date(parseInt(year), parseInt(month) - 1);

            const label = date.toLocaleString('es-AR', {
                month: 'short',
                year: 'numeric'
            }).replace('.', '');

            return label.charAt(0).toUpperCase() + label.slice(1);
        });

        monthlyChartInstance = new Chart(document.getElementById('monthlyChart'), {
            type: 'line',
            data: {
                labels: formattedLabels,
                datasets: [{
                    label: 'Asignaciones',
                    data: monthValues,
                    borderColor: '#0d6efd',
                    backgroundColor: 'rgba(13,110,253,0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        });

        // ================= FILTER =================

        document.getElementById("houseFilter").addEventListener("change", function () {

            const houseId = this.value;

            fetch(`/webmaster/statistics/filter?houseId=${houseId}`)
                .then(response => response.json())
                .then(data => updateDashboard(data));
        });

        // ================= UPDATE DASHBOARD =================

        function updateDashboard(data) {

            // ===== UPDATE METRICS =====
            document.querySelectorAll(".metric-value")[0].textContent = data.totalRuns;
            document.querySelectorAll(".metric-value")[1].textContent = data.activeRuns;
            document.querySelectorAll(".metric-value")[2].textContent = data.archivedRuns;
            document.querySelectorAll(".metric-value")[3].textContent = data.totalAssignments;

            // ===== DESTROY OLD CHARTS =====
            personChartInstance.destroy();
            functionChartInstance.destroy();
            monthlyChartInstance.destroy();

            // ===== REBUILD PERSON DATA =====
            const personLabels = Object.keys(data.personStats);
            const personValues = Object.values(data.personStats);

            personChartInstance = new Chart(document.getElementById('personChart'), {
                type: 'bar',
                data: {
                    labels: personLabels,
                    datasets: [{
                        data: personValues,
                        backgroundColor: '#0d6efd',
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });

            // ===== REBUILD FUNCTION DATA =====
            const functionLabels = Object.keys(data.functionStats);
            const functionValues = Object.values(data.functionStats);

            functionChartInstance = new Chart(document.getElementById('functionChart'), {
                type: 'doughnut',
                data: {
                    labels: functionLabels,
                    datasets: [{
                        data: functionValues,
                        backgroundColor: [
                            '#0d6efd', '#198754', '#ffc107',
                            '#6c757d', '#fd7e14', '#0dcaf0', '#dc3545'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });

            // ===== REBUILD MONTHLY DATA =====
            const monthLabels = data.monthlyStats.map(m => m.month);
            const monthValues = data.monthlyStats.map(m => m.count);

            const formattedLabels = monthLabels.map(m => {
                const [year, month] = m.split('-');

                // month - 1 porque JS empieza en 0
                const date = new Date(parseInt(year), parseInt(month) - 1);

                const label = date.toLocaleString('es-AR', {
                    month: 'short',
                    year: 'numeric'
                }).replace('.', '');

                return label.charAt(0).toUpperCase() + label.slice(1);
            });

            monthlyChartInstance = new Chart(document.getElementById('monthlyChart'), {
                type: 'line',
                data: {
                    labels: formattedLabels,
                    datasets: [{
                        label: 'Asignaciones',
                        data: monthValues,
                        borderColor: '#0d6efd',
                        backgroundColor: 'rgba(13,110,253,0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

    </script>

    <!-- ================= STYLES ================= -->
    <style>
        .metric-card {
            border: 0;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .metric-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
        }

        .metric-label {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .chart-card {
            border: 0;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            transition: all 0.25s ease;
        }

        .chart-card:hover {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .chart-wrapper {
            height: 350px;
        }
    </style>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

</section>

</html>
