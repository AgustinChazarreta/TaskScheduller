<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::section})}">

<section>

    <main class="container-fluid py-4">

        <!-- HEADER -->
        <div class="bg-white rounded-4 shadow-sm p-4 mb-4 border-soft">
            <div class="d-flex justify-content-between align-items-center">

                <div>
                    <h2 class="fw-bold mb-1">
                        <i class="bi bi-clock-history text-primary me-2"></i>
                        Schedule Runs
                    </h2>
                    <small class="text-muted">
                        Historial global de ejecuciones del sistema
                    </small>
                </div>

            </div>
        </div>


        <!-- TABLA -->
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-0">

                <div class="table-responsive">
                    <table class="table align-middle mb-0 table-hover">

                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Fecha</th>
                                <th>House</th>
                                <th>Rango</th>
                                <th>Score</th>
                                <th class="pe-4">Estado</th>
                            </tr>
                        </thead>

                        <tbody>

                            <!-- FILAS -->
                            <tr th:each="run : ${scheduleRuns}">

                                <!-- Fecha -->
                                <td class="ps-4">
                                    <div class="fw-semibold"
                                        th:text="${#temporals.format(run.createdAt, 'dd ''de'' MMMM yyyy')}">
                                    </div>
                                    <small class="text-muted"
                                        th:text="${#temporals.format(run.createdAt, 'HH:mm')} + ' hs'">
                                    </small>
                                </td>

                                <!-- House -->
                                <td class="fw-semibold">
                                    <span class="badge bg-primary-subtle text-primary" th:text="${run.house.name}">
                                    </span>
                                </td>

                                <!-- Rango -->
                                <td>
                                    <div class="d-flex align-items-center gap-3 text-muted">
                                        <div>
                                            <small>Inicio</small>
                                            <div class="fw-semibold"
                                                th:text="${#temporals.format(run.startDate, 'dd MMM yyyy')}">
                                            </div>
                                        </div>

                                        <i class="bi bi-arrow-right-circle text-secondary fs-5"></i>

                                        <div>
                                            <small>Fin</small>
                                            <div class="fw-semibold"
                                                th:text="${#temporals.format(run.endDate, 'dd MMM yyyy')}">
                                            </div>
                                        </div>
                                    </div>
                                </td>

                                <!-- Score -->
                                <td>
                                    <span class="fw-semibold" th:text="${run.score}">
                                    </span>
                                </td>

                                <!-- Estado -->
                                <td class="pe-4">

                                    <span class="badge bg-success-subtle text-success"
                                        th:if="${run.status.name() == 'ACTIVE'}">
                                        Active
                                    </span>

                                    <span class="badge bg-secondary-subtle text-secondary"
                                        th:if="${run.status.name() == 'ARCHIVED'}">
                                        Archived
                                    </span>

                                    <span class="badge bg-danger-subtle text-danger"
                                        th:if="${run.status.name() == 'INVALIDATED'}">
                                        Invalidated
                                    </span>

                                </td>

                            </tr>

                            <!-- EMPTY -->
                            <tr th:if="${#lists.isEmpty(scheduleRuns)}">
                                <td colspan="5" class="text-center py-5 text-muted">
                                    No hay ejecuciones registradas.
                                </td>
                            </tr>

                        </tbody>

                    </table>
                </div>

            </div>
        </div>

    </main>

</section>

</html>
