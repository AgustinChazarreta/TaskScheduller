<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:replace="~{layout/main :: layout(~{::section})}">

<section>

    <main class="container-fluid py-4">

        <!-- Mensajes de éxito / error -->
        <div th:if="${successMessage}" th:unless="${createdUserEmail}"
            class="alert alert-success alert-dismissible fade show rounded-3 shadow-sm">
            <strong th:text="${successMessage}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${createdUserEmail}" class="alert alert-success alert-dismissible fade show rounded-3 shadow-sm">
            <strong>Usuario creado correctamente</strong><br>
            Username: <strong th:text="${createdUserEmail}"></strong><br>
            Password temporal: <strong th:text="${temporaryPassword}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-3 shadow-sm">
            <strong th:text="${errorMessage}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- HEADER -->
        <div class="bg-white rounded-4 shadow-sm p-4 mb-4 border-soft">
            <div class="d-flex justify-content-between align-items-center flex-wrap">
                <div>
                    <h2 class="fw-bold mb-0">
                        <i class="bi bi-people text-primary me-2"></i>
                        Gestión de Cuentas
                    </h2>
                    <small class="text-muted">Control de usuarios y admins</small>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <!-- FILTRO POR ROL -->
                    <select id="roleFilter" class="form-select form-select-sm" style="width:180px;">
                        <option value="ALL">Todos los roles</option>
                        <option value="ADMIN">Admins</option>
                        <option value="USER">Users</option>
                    </select>

                    <button class="btn btn-primary rounded-pill px-4" id="btnOpenRoleChoice">
                        <i class="bi bi-plus-lg me-2"></i>
                        Nueva Cuenta
                    </button>
                </div>
            </div>
        </div>

        <!-- TABLA DE USUARIOS -->
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table align-middle mb-0 table-hover">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Nombre</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>House</th>
                                <th>Fecha de creación</th>
                                <th class="text-end pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usersTable">
                            <tr th:each="user : ${users}" th:attr="data-role=${user.role.name()}">
                                <td class="ps-4 fw-semibold"
                                    th:text="${user.role.name() == 'USER' ? (user.person != null ? user.person.fullName : user.username) : user.username}">
                                </td>
                                <td>
                                    <span class="badge bg-primary-subtle text-primary"
                                        th:if="${user.role.name() == 'ADMIN'}">Admin</span>
                                    <span class="badge bg-warning-subtle text-warning"
                                        th:if="${user.role.name() == 'USER'}">User</span>
                                </td>
                                <td>
                                    <span class="badge bg-success-subtle text-success"
                                        th:if="${user.active}">Activo</span>
                                    <span class="badge bg-secondary-subtle text-secondary"
                                        th:if="${!user.active}">Inactivo</span>
                                </td>
                                <td>
                                    <span class="badge bg-info-subtle text-dark"
                                        th:text="${user.house != null ? user.house.name : '-'}"></span>
                                </td>
                                <td>
                                    <div class="fw-semibold"
                                        th:text="${#temporals.format(user.createdAt,'dd ''de'' MMMM yyyy')}"></div>
                                    <small class="text-muted"
                                        th:text="${#temporals.format(user.createdAt,'HH:mm')} + ' hs'"></small>
                                </td>
                                <td class="text-end pe-4">
                                    <button class="btn btn-sm btn-outline-secondary rounded-circle me-2"
                                        data-bs-toggle="modal" th:data-bs-target="'#editUserModal-' + ${user.id}">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger rounded-circle" data-bs-toggle="modal"
                                        th:data-bs-target="'#deleteUserModal-' + ${user.id}">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(users)}">
                                <td colspan="6" class="text-center py-5 text-muted">No hay usuarios registrados.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- MODAL DE ELECCIÓN DE ROL -->
    <div class="modal fade" id="roleChoiceModal" tabindex="-1" aria-labelledby="roleChoiceModalLabel" aria-hidden="true"
        data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Crear Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <p>Seleccione el tipo de cuenta a crear:</p>
                    <button class="btn btn-primary me-2" id="chooseAdmin">Admin</button>
                    <button class="btn btn-warning" id="chooseUser">User</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL CREAR ADMIN -->
    <div class="modal fade" id="createAdminModal" tabindex="-1" aria-labelledby="createAdminModalLabel"
        aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Crear Admin</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createAdminForm" th:action="@{/webmaster/users/create-admin}" method="post">
                        <div class="mb-3">
                            <label for="adminHouse" class="form-label">House</label>
                            <select id="adminHouse" name="houseId" class="form-select" required>
                                <option th:each="house : ${houses}" th:value="${house.id}" th:text="${house.name}">
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="adminUsername" class="form-label">Usuario</label>
                            <input type="text" class="form-control" id="adminUsername" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="adminPassword" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="adminPassword" name="password" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="createAdminForm" class="btn btn-primary">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL CREAR USER -->
    <div class="modal fade" id="createUserModal" tabindex="-1" aria-labelledby="createUserModalLabel" aria-hidden="true"
        data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Crear Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createUserForm" th:action="@{/webmaster/users/create-user}" method="post"
                        enctype="multipart/form-data">
                        <!-- Aquí van los campos específicos de usuario -->
                        <div class="mb-3">
                            <label for="userHouse" class="form-label">House</label>
                            <select id="userHouse" name="houseId" class="form-select" required>
                                <option th:each="house : ${houses}" th:value="${house.id}" th:text="${house.name}">
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="personFullName" class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="personFullName" name="personFullName" required>
                        </div>
                        <div class="mb-3">
                            <label for="personEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="personEmail" name="personEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="personBirthDate" class="form-label">Fecha de nacimiento</label>
                            <input type="date" class="form-control" id="personBirthDate" name="personBirthDate"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="personEntryDate" class="form-label">Fecha de ingreso</label>
                            <input type="date" class="form-control" id="personEntryDate" name="personEntryDate"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="personPhoto" class="form-label">Foto (opcional)</label>
                            <input type="file" class="form-control" id="personPhoto" name="personPhoto">
                        </div>
                        <!-- Más campos según tu DTO -->
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="createUserForm" class="btn btn-primary">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================= -->
    <!-- SCRIPT FILTRO POR ROL Y MODALES -->
    <!-- ============================= -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // FILTRO POR ROL
            const roleFilter = document.getElementById("roleFilter");
            const rows = document.querySelectorAll("#usersTable tr[data-role]");
            roleFilter.addEventListener("change", function () {
                const selected = this.value;
                rows.forEach(row => {
                    row.style.display = (selected === "ALL" || row.getAttribute("data-role") === selected) ? "" : "none";
                });
            });

            // MODALES
            const roleChoiceModalEl = document.getElementById('roleChoiceModal');
            const createAdminModalEl = document.getElementById('createAdminModal');
            const createUserModalEl = document.getElementById('createUserModal');

            const roleChoiceModal = new bootstrap.Modal(roleChoiceModalEl, { backdrop: 'static', keyboard: false });
            const createAdminModal = new bootstrap.Modal(createAdminModalEl, { backdrop: 'static', keyboard: false });
            const createUserModal = new bootstrap.Modal(createUserModalEl, { backdrop: 'static', keyboard: false });

            document.getElementById('btnOpenRoleChoice').addEventListener('click', () => {
                roleChoiceModal.show();
            });

            document.getElementById('chooseAdmin').addEventListener('click', () => {
                roleChoiceModal.hide();
                createAdminModal.show();
            });

            document.getElementById('chooseUser').addEventListener('click', () => {
                roleChoiceModal.hide();
                createUserModal.show();
            });
        });
    </script>

</section>

</html>
