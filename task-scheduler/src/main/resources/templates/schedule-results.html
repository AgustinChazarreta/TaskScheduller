<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::section})}">
<section>
    <style th:inline="text">
        @media print {
            .day-block {
                page-break-inside: avoid;
            }

            .card {
                page-break-inside: avoid;
                break-inside: avoid;
            }
        }
    </style>

    <main class="container-fluid py-4">
        <!-- HEADER -->
        <div class="bg-white rounded-4 shadow-sm p-4 mb-4 border-soft">
            <div class="d-flex align-items-center">
                <h1 class="fw-bold mb-0">
                    <i class="bi bi-check-circle text-primary me-2"></i>
                    Resultados del Schedule
                </h1>
            </div>
        </div>
    </main>

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="resultsContainer" class="bg-white rounded-4 shadow-sm p-4 border-soft mb-4">

        <!-- Semana -->
        <div class="d-flex justify-content-center mb-4">
            <div class="bg-white shadow-sm rounded-4 px-4 py-3 border-soft" id="weekLabel">
                <!-- El badge se genera desde JS -->
            </div>
        </div>

        <!-- Asignaciones -->
        <div id="assignmentsContainer" class="d-flex flex-wrap justify-content-center mb-3" style="gap: 2rem;">
            <!-- cards generadas dinámicamente -->
        </div>

        <!-- Navegación semanas -->
        <div class="d-flex justify-content-center gap-3 mb-3">
            <button class="btn btn-primary rounded-pill px-4" onclick="prevWeek()">Semana anterior</button>
            <button class="btn btn-primary rounded-pill px-4" onclick="nextWeek()">Semana siguiente</button>
        </div>

        <!-- Volver al dashboard -->
        <div class="text-center mt-4">
            <button class="btn btn-secondary rounded-pill px-4"
                onclick="window.location.href='/admin/dashboard'">Volver</button>
        </div>
    </div>

    <script>
        let assignments = [];
        let currentWeek = 1;
        let maxWeek = 1;
        let weekMap = {};
        let inverseWeekMap = {};
        const order = ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY", "SUNDAY"];

        document.addEventListener('DOMContentLoaded', () => {
            checkScheduleStatusAndLoad();
        });

        function loadResults() {
            const result = JSON.parse(sessionStorage.getItem('scheduleResults'));
            const container = document.getElementById('resultsContainer');
            const weekLabel = document.getElementById('weekLabel');

            if (!result || !result.assignments || result.assignments.length === 0) {
                container.innerHTML = `<p class="text-muted text-center py-5">No hay resultados disponibles.</p>`;
                weekLabel.innerHTML = ``;
                return;
            }

            assignments = result.assignments;

            const uniqueWeeks = [...new Set(assignments.map(a => a.week))].sort((a, b) => a - b);
            weekMap = {};
            inverseWeekMap = {};
            uniqueWeeks.forEach((realWeek, index) => {
                const normalized = index + 1;
                weekMap[realWeek] = normalized;
                inverseWeekMap[normalized] = realWeek;
            });

            maxWeek = uniqueWeeks.length;
            currentWeek = 1;
            renderCards();
        }

        async function checkScheduleStatusAndLoad() {
            const container = document.getElementById('resultsContainer');
            const weekLabel = document.getElementById('weekLabel');

            try {
                const res = await fetch('/api/admin/schedule/status');
                if (!res.ok) throw new Error();

                const { invalidated } = await res.json();
                if (invalidated) {
                    weekLabel.innerHTML = '';
                    container.innerHTML = `
                        <div class="d-flex flex-column justify-content-center text-center text-muted" style="min-height: 50vh;">
                            <i class="bi bi-exclamation-triangle fs-1 mb-3"></i>
                            <h4>Resultados no disponibles</h4>
                            <p>El schedule fue modificado y necesita resolverse nuevamente.</p>
                        </div>`;
                    return;
                }
                loadResults();
            } catch (e) {
                container.innerHTML = `<p class="text-danger text-center py-5">No se pudo verificar el estado del schedule</p>`;
            }
        }

        function renderCards() {
            const container = document.getElementById('assignmentsContainer');
            const weekLabel = document.getElementById('weekLabel');
            const realWeek = inverseWeekMap[currentWeek];

            // Actualizar el badge dentro del recuadro centrado
            weekLabel.innerHTML = `<span class="badge bg-primary fs-2">${"Semana " + currentWeek}</span>`;

            let html = "";
            order.forEach(day => {
                const functionsOfDay = assignments
                    .filter(a => a.week === realWeek)
                    .filter(a => (Array.isArray(a.day) ? a.day : [a.day]).includes(day));

                if (functionsOfDay.length > 0) {
                    html += `<div class="day-block d-flex flex-column align-items-center shadow-sm rounded-4 p-3 mb-3"
                        style="flex: 1 1 250px; max-width: 300px; min-width: 200px; gap: 0.5rem;">`;

                    html += `<h5 class="w-100 text-center mb-2">
                        <span class="badge bg-danger bg-gradient px-3 py-2"
                            style="font-size: clamp(0.8rem, 2vw, 1.2rem);">
                            ${formatDays([day])}
                        </span>
                    </h5>`;

                    functionsOfDay.forEach(a => {
                        html += `
                        <div class="card shadow-sm rounded-4 w-100" style="padding: 0.5rem 1rem;">
                            <div class="card-body d-grid" style="
                                grid-template-columns: 1fr auto; 
                                gap: 0.5rem; 
                                font-size: clamp(0.7rem, 1.5vw, 1rem); 
                                padding: 0.5rem;">
                                <div><strong>${a.personName}${a.personNickname ? ` (${a.personNickname})` : ""}</strong></div>
                                <div class="badge bg-success bg-gradient px-2 py-2 text-truncate" 
                                    style="font-size: clamp(0.5rem, 1.3vw, 0.9rem);">${a.functionName}</div>
                            </div>
                        </div>`;
                    });

                    html += `</div>`; // cierre day-block
                }
            });

            container.innerHTML = html || `<p class="text-muted text-center py-3">No hay funciones para esta semana</p>`;

            document.querySelector('button[onclick="prevWeek()"]').disabled = currentWeek === 1;
            document.querySelector('button[onclick="nextWeek()"]').disabled = currentWeek === maxWeek;
        }

        function nextWeek() { if (currentWeek < maxWeek) { currentWeek++; renderCards(); } }
        function prevWeek() { if (currentWeek > 1) { currentWeek--; renderCards(); } }

        function formatDays(days) {
            const labels = {
                MONDAY: "Lunes",
                TUESDAY: "Martes",
                WEDNESDAY: "Miércoles",
                THURSDAY: "Jueves",
                FRIDAY: "Viernes",
                SATURDAY: "Sábado",
                SUNDAY: "Domingo",
            };
            return order.filter(d => days.includes(d)).map(d => labels[d]).join(", ");
        }
    </script>
</section>

</html>
