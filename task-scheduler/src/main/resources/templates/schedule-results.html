<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::section})}">
<section>
    <style th:inline="text">
        @media print {

            .day-block,
            .card {
                page-break-inside: avoid;
                break-inside: avoid;
            }
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(80px, 1fr));
            gap: 0.25rem;
            overflow-x: auto;
        }

        .day-header {
            font-weight: bold;
            text-align: center;
            margin-bottom: 0.05rem;
            font-size: clamp(0.65rem, 0.9vw, 0.8rem);
            background-color: #f0f0f0;
            border-radius: 0.5rem;
            padding: 0.05rem 0;
        }

        .function-badge {
            font-size: clamp(0.6rem, 0.9vw, 0.75rem);
            padding: 0.15rem 0.25rem;
            border-radius: 0.25rem;
            background-color: #198754;
            color: white;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .function-badge.draggable {
            cursor: grab;
        }

        .day-cell {
            border: 1px solid #ddd;
            border-radius: 0.5rem;
            min-height: 100px;
            max-height: 150px;
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            padding: 0.25rem;
            font-size: 0.8rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
        }

        .day-cell:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }

        .day-cell.drag-over {
            border: 2px dashed #0d6efd;
        }

        .day-cell .assignments-container {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            overflow-y: auto;
        }

        /* Botón flotante guardar cambios */
        #saveChangesBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: none;
            z-index: 9999;
        }
    </style>

    <div id="alertContainer" class="container-fluid mt-3"></div>

    <main class="container-fluid py-2">
        <div
            class="bg-white rounded-4 shadow-sm p-3 mb-4 border-soft d-flex justify-content-between align-items-center">

            <h2 class="fw-bold mb-0">
                <i class="bi bi-calendar-check text-primary me-2"></i>
                Schedule Mensual
            </h2>


            <div class="d-flex gap-2">
                <button id="generatePdfBtn" class="btn btn-danger rounded-pill px-4" onclick="generatePDF()">
                    <i class="bi bi-filetype-pdf"></i>
                    Generar PDF
                </button>

                <button type="button" id="sendPdfEmailBtn" class="btn btn-primary rounded-pill px-4"
                    onclick="sendPdfByEmail()"> <i class="bi bi-envelope-fill"></i>
                    Enviar por mail
                </button>
                
            </div>

        </div>

        <!-- ================= GENERADOR ================= -->
        <div class="card border-0 shadow-sm rounded-4 mb-4 overlay-wrapper" id="resolveCard">
            <div class="card-body p-4">

                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
                    <h5 class="fw-bold mb-0">
                        <i class="bi bi-cpu me-2"></i>
                        Generador de Schedule
                    </h5>
                    <small class="text-muted">
                        Motor de optimización automática
                    </small>
                </div>

                <form id="scheduleForm">

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="startDate" class="form-label fw-semibold">
                                Fecha de inicio
                            </label>
                            <input type="date" class="form-control rounded-3" id="startDate" required>
                        </div>

                        <div class="col-md-6">
                            <label for="endDate" class="form-label fw-semibold">
                                Fecha de fin
                            </label>
                            <input type="date" class="form-control rounded-3" id="endDate" required>
                        </div>
                    </div>

                    <div class="text-end">
                        <button type="submit" class="btn btn-primary px-4 py-2" id="resolveBtn">

                            <span id="resolveText">
                                <i class="bi bi-cpu me-1"></i>
                                Generar Schedule
                            </span>

                            <span id="resolveSpinner" class="d-none">
                                <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                                Resolviendo...
                            </span>

                        </button>
                    </div>

                </form>

            </div>
        </div>
