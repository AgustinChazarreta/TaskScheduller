<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Login | Functions Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" media="print"
    onload="this.media='all'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/adminlte.css">

  <style>
    body.login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Source Sans 3', sans-serif;

      background:
        radial-gradient(circle at 20% 30%, rgba(217, 83, 79, 0.08), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(217, 83, 79, 0.08), transparent 40%),
        linear-gradient(135deg, #f8f9fa, #e9eff5);
    }

    .login-box {
      width: 380px;
    }

    .card {
      border-radius: 22px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(0, 0, 0, 0.05);

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.10),
        0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 1.4rem;
    }

    .login-logo span {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: .4px;
      color: #d9534f;
    }

    .login-card-body {
      padding: 2rem;
    }

    .login-box-msg {
      text-align: center;
      margin-bottom: 1.4rem;
      color: #555;
    }

    .form-control {
      border-radius: 12px;
    }

    .input-group-text {
      background: #f8f9fa;
      border-radius: 12px;
      cursor: pointer;
    }

    .form-control:focus {
      border-color: #d9534f;
      box-shadow: 0 0 0 3px rgba(217, 83, 79, 0.15);
    }

    .btn-primary {
      background: linear-gradient(135deg, #d9534f, #c12e2a);
      border: none;
      border-radius: 12px;
      font-weight: 600;
    }

    .btn-primary:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    a {
      text-decoration: none;
      font-weight: 500;
      color: #d9534f;
    }

    a:hover {
      color: #c12e2a;
    }

    .input-group-text i,
    .input-group-text span {
      color: #d9534f;
    }
  </style>
</head>

<body class="login-page">

  <div class="login-box">

    <div class="login-logo">
      <span>
        <i class="bi bi-calendar-check me-2"></i>
        Functions Planner
      </span>
    </div>

    <div class="card">
      <div class="card-body login-card-body">

        <p class="login-box-msg">
          ¡Bienvenido! Inicia sesión para continuar
        </p>

        <!-- ERROR LOGIN -->
        <div id="loginError" th:if="${param.error}" class="alert alert-danger text-center">
          Usuario o contraseña incorrectos
        </div>

        <form id="loginForm" action="/login" method="post" autocomplete="on" novalidate>

          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

          <!-- USERNAME -->
          <div class="input-group mb-3">

            <input id="loginUsername" name="username" type="text" class="form-control" placeholder="Usuario"
              autocomplete="username" required autofocus>

            <div class="input-group-text">
              <span class="bi bi-person-fill"></span>
            </div>

          </div>

          <!-- PASSWORD -->
          <div class="input-group mb-3">

            <input id="loginPassword" name="password" type="password" class="form-control" placeholder="Contraseña"
              autocomplete="current-password" required>

            <div class="input-group-text" onclick="togglePassword()">
              <i id="eyeIcon" class="bi bi-eye"></i>
            </div>

          </div>

          <div class="row mb-3">

            <div class="col-7">

              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="remember-me" value="true" id="rememberMe">
                <label class="form-check-label" for="rememberMe">
                  Recordarme
                </label>
              </div>

            </div>

            <div class="col-5">

              <button type="submit" class="btn btn-primary w-100" id="loginBtn">

                <span id="btnText">
                  Ingresar
                </span>

                <span id="btnLoader" class="spinner-border spinner-border-sm d-none"></span>

              </button>

            </div>

          </div>

        </form>

        <div class="text-center mt-3">
          <a href="/forgot-password" class="text-danger">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js"></script>

  <script>

    function togglePassword() {

      const input = document.getElementById("loginPassword");
      const icon = document.getElementById("eyeIcon");

      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("bi-eye", "bi-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("bi-eye-slash", "bi-eye");
      }

    }

    document.addEventListener("DOMContentLoaded", () => {

      const form = document.getElementById("loginForm");
      const button = document.getElementById("loginBtn");
      const error = document.getElementById("loginError");

      if (error) {

        setTimeout(() => {

          error.style.transition = "opacity .6s";
          error.style.opacity = "0";

          setTimeout(() => {
            error.remove();
          }, 600);

        }, 2500);

      }

      form.addEventListener("submit", () => {

        document.getElementById("btnText").classList.add("d-none");
        document.getElementById("btnLoader").classList.remove("d-none");

        button.disabled = true;

      });

    });

  </script>

</body>

</html>
