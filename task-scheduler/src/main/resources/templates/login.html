<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>Login | Mi Sistema</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" media="print"
    onload="this.media='all'" />
  <!-- OverlayScrollbars -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/styles/overlayscrollbars.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <!-- AdminLTE -->
  <link rel="stylesheet" href="../css/adminlte.css" />

  <style>
    body.login-page {
      /* degradado muy suave */
      background: linear-gradient(135deg, #f8f9fa, #e9eff5);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Source Sans 3', sans-serif;
    }

    .login-box {
      width: 380px;
    }

    .card {
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      /* sombra sutil */
      overflow: hidden;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 1rem;
    }

    .login-logo span {
      font-size: 1.8rem;
      font-weight: bold;
      color: #d9534f;
    }

    .login-card-body {
      background: #fff;
      padding: 2rem;
      border-radius: 0 0 12px 12px;
    }

    .login-box-msg {
      font-weight: 500;
      margin-bottom: 1.5rem;
      text-align: center;
      color: #495057;
    }

    .form-control:focus {
      border-color: #d9534f;
      box-shadow: 0 0 5px rgba(217, 83, 79, 0.3);
    }

    .btn-primary {
      background: #d9534f;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background: #c12e2a;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(217, 83, 79, 0.3);
    }

    a {
      text-decoration: none;
      color: #d9534f;
    }

    a:hover {
      text-decoration: underline;
      color: #c12e2a;
    }
  </style>
</head>

<body class="login-page">
  <div class="login-box">
    <div class="login-logo">
      <span style="color:#d9534f; font-size:1.8rem;">
        <span style="margin-right: 1rem;">✝</span>Functions Planner
      </span>
    </div>

    <div class="card">
      <div class="card-body login-card-body">
        <p class="login-box-msg">¡Bienvenido! Inicia sesión para continuar</p>

        <form action="/login" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

          <div class="input-group mb-3">
            <input id="loginUsername" name="username" type="text" class="form-control" placeholder="Usuario" required />
            <div class="input-group-text"><span class="bi bi-person-fill"></span></div>
          </div>

          <div class="input-group mb-3">
            <input id="loginPassword" name="password" type="password" class="form-control" placeholder="Contraseña"
              required />
            <div class="input-group-text"><span class="bi bi-lock-fill"></span></div>
          </div>

          <div class="row mb-3">
            <div class="col-8">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe" />
                <label class="form-check-label" for="rememberMe">Recordarme</label>
              </div>
            </div>
            <div class="col-4">
              <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </div>
          </div>
        </form>

        <p class="mb-1 text-center"><a href="forgot-password.html">¿Olvidaste tu contraseña?</a></p>
        <p class="mb-0 text-center"><a href="register.html">Registrar una nueva cuenta</a></p>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script
    src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js"></script>
  <script src="../js/adminlte.js"></script>
</body>

</html>
