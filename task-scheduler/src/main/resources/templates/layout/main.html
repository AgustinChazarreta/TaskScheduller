<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">

<head>
    <meta charset="UTF-8" />
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Task Scheduler</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/adminlte.css" />
    <!-- Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

    <!-- 🔴 jQuery (OBLIGATORIO, antes que Select2) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Select2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <style>
        /* 🔥 FIX Select2 + AdminLTE + Modal */
        .select2-container {
            z-index: 1060 !important;
        }

        .select2-dropdown {
            z-index: 1060 !important;
        }

        /* 🔧 Fix scroll modales con AdminLTE */
        .modal-dialog-scrollable .modal-body {
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }

        /* Asegura que el modal pueda overflow */
        .modal {
            overflow-y: auto;
        }

        /* Estilos de impresión personalizados */
        @media print {
            body {
                overflow: visible !important;
                height: auto !important;
                background-color: white !important;
                /* Fuerza fondo blanco en el body */
            }

            .app-wrapper,
            .content-wrapper,
            .app-main {
                display: block !important;
                position: static !important;
                overflow: visible !important;
                height: auto !important;
                min-height: unset !important;
                background-color: white !important;
                /* Fondo blanco para evitar grises */
            }

            .app-sidebar {
                display: none !important;
            }

            .day-block,
            .card {
                page-break-inside: avoid !important;
                background-color: white !important;
                /* Fondo blanco en tarjetas y bloques */
            }

            /* Forzar colores exactos, pero sin filtros grises */
            * {
                -webkit-print-color-adjust: exact !important;
                color-adjust: exact !important;
                background-color: transparent !important;
                /* Evita fondos grises heredados, excepto donde se especifique */
            }

            /* Excepciones: Mantén colores específicos si quieres */
            .badge.bg-primary {
                background-color: #007bff !important;
                color: white !important;
            }

            /* Azul para semana */
            .badge.bg-danger {
                background-color: #dc3545 !important;
                color: white !important;
            }

            /* Rojo para días */
            .badge.bg-success {
                background-color: #28a745 !important;
                color: white !important;
            }

            /* Verde para tareas */
        }
    </style>
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">

        <!-- HEADER -->
        <nav class="app-header navbar navbar-expand bg-body">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1">Task Scheduler</span>
            </div>
        </nav>

        <!-- SIDEBAR -->
        <aside class="app-sidebar bg-dark shadow" data-bs-theme="dark">
            <a href="/admin/dashboard" class="brand-link" style="text-decoration: none">
                <div class="sidebar-brand mt-2">
                    <span class="brand-text fw-bold fs-3">
                        <i class="bi bi-ui-checks-grid me-2 fs-3"></i>Scheduler
                    </span>
                </div>
            </a>

            <div class="sidebar-wrapper">
                <nav class="mt-2">
                    <ul class="nav sidebar-menu flex-column">
                        <li class="nav-item">
                            <a href="/admin/tasks" class="nav-link">
                                <i class="nav-icon bi bi-list-task"></i>
                                <p>Tareas</p>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="/admin/persons" class="nav-link">
                                <i class="nav-icon bi bi-people"></i>
                                <p>Personas</p>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="/results" class="nav-link">
                                <i class="nav-icon bi bi-speedometer"></i>
                                <p>Resultados</p>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="app-main">
            <div class="container-fluid py-4 px-4">
                <th:block th:replace="${content}"></th:block>
            </div>
        </main>

        <!-- FOOTER -->
        <footer class="app-footer text-center">
            <strong>Task Scheduler</strong> © 2026
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/adminlte.js"></script>
</body>

</html>
