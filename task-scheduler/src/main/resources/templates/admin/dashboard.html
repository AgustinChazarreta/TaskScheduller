<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::section})}">

<section>

    <h1 class="mb-4">
        <i class="bi bi-speedometer2 me-2"></i>
        Admin Dashboard
    </h1>

    <!-- ================= ESTADO DEL SCHEDULE ================= -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header">
            <h4>Estado del Schedule</h4>
        </div>
        <div class="card-body d-flex gap-4 align-items-center">
            <div>
                <strong>Último resuelto:</strong>
                <span id="lastSolvedAt">Nunca</span>
            </div>
            <div>
                <strong>Estado:</strong>
                <span id="scheduleStatus" class="badge bg-secondary">
                    Cargando...
                </span>
            </div>
        </div>
    </div>

    <!-- ================= ALERTAS ================= -->
    <div id="alertContainer"></div>

    <!-- ================= RESOLVER SCHEDULE ================= -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header">
            <h4>Resolver Schedule</h4>
        </div>
        <div class="card-body">
            <form id="scheduleForm">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="startDate" class="form-label">Fecha de inicio</label>
                        <input type="date" class="form-control" id="startDate" required>
                    </div>
                    <div class="col-md-6">
                        <label for="endDate" class="form-label">Fecha de fin</label>
                        <input type="date" class="form-control" id="endDate" required>
                    </div>
                </div>

                <div class="text-end">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-cpu me-1"></i>
                        Generar Schedule
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- PERSONAS -->
    <div class="card mb-4">
        <div class="card-header">
            <h3 class="card-title">Personas disponibles</h3>
        </div>

        <div class="card-body" id="personsContainer">
            <p class="text-muted mb-0">Cargando personas...</p>
        </div>
    </div>

    <!-- ================= TAREAS ================= -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header">
            <h4>Tareas cargadas</h4>
        </div>
        <div class="card-body" id="tasksContainer">
            <p class="text-muted mb-0">Cargando tareas...</p>
        </div>
    </div>

    
    <script src="/js/csrf.js"></script>
    <script src="/js/dashboard.js"></script>
</section>

</html>
