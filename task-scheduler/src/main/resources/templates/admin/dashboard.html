<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::section})}">

<section>

    <h1 class="mb-4">
        <i class="bi bi-play-circle me-2"></i>
        Admin Dashboard
    </h1>

    <!-- ================= INFORMACIÓN DEL ADMIN ================= -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header">
            <h4>Información del Administrador</h4>
        </div>

        <div class="card-body d-flex justify-content-between align-items-center flex-wrap">

            <!-- DATOS PERSONALES -->
            <div>
                <div class="mb-2">
                    <strong>Usuario:</strong>
                    <span th:text="${adminName}">Admin</span>
                </div>

                <div>
                    <strong>Rol:</strong>
                    <span class="badge bg-info text-dark" th:text="${role}">ADMIN</span>
                </div>
            </div>

            <!-- CASA -->
            <div class="text-end">
                <strong>Casa:</strong>
                <span class="badge bg-dark fs-6 px-3 py-2 ms-2">
                    <span th:text="${houseName}">House Name</span>
                </span>
            </div>

        </div>
    </div>


    <!-- ================= ESTADO DEL SCHEDULE ================= -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header">
            <h4>Estado del Schedule</h4>
        </div>
        <div class="card-body d-flex gap-4 align-items-center">

            <div class="me-3">
                <strong>Última resolución:</strong>
                <span id="lastSolvedAt">Cargando...</span>
            </div>

            <div>
                <strong class="me-1">Estado:</strong>
                <span id="scheduleStatus" class="badge bg-secondary fs-5 px-2 py-1">
                    Cargando...
                </span>
            </div>
        </div>

    </div>

    <!-- ================= ALERTAS ================= -->
    <div id="alertContainer"></div>

    <!-- ================= RESOLVER SCHEDULE ================= -->
    <div class="card mb-4 shadow-sm overlay-wrapper" id="resolveCard">
        <div class="card-header">
            <h4>Resolver Schedule</h4>
        </div>

        <div class="card-body">
            <form id="scheduleForm">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="startDate" class="form-label">Fecha de inicio</label>
                        <input type="date" class="form-control" id="startDate" required>
                    </div>
                    <div class="col-md-6">
                        <label for="endDate" class="form-label">Fecha de fin</label>
                        <input type="date" class="form-control" id="endDate" required>
                    </div>
                </div>

                <div class="text-end">
                    <button type="submit" class="btn btn-primary" id="resolveBtn">

                        <!-- TEXTO NORMAL -->
                        <span id="resolveText">
                            <i class="bi bi-cpu me-1"></i>
                            Generar Schedule
                        </span>

                        <!-- SPINNER -->
                        <span id="resolveSpinner" class="d-none">
                            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                            Resolviendo...
                        </span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- PERSONAS -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header">
            <h4>Personas disponibles</h4>
        </div>

        <div class="card-body" id="personsContainer">
            <p class="text-muted mb-0">Cargando personas...</p>
        </div>
    </div>

    <!-- ================= TAREAS ================= -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header">
            <h4>Funciones cargadas</h4>
        </div>
        <div class="card-body" id="functionsContainer">
            <p class="text-muted mb-0">Cargando funciones...</p>
        </div>
    </div>


    <script src="/js/csrf.js"></script>
    <script src="/js/dashboard.js"></script>
</section>

</html>
