<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::section})}">

<section>

    <main class="container-fluid py-4">

        <!-- ALERTS -->
        <div id="alertContainer"></div>

        <!-- HEADER -->
        <div class="bg-white rounded-4 shadow-sm p-4 mb-4 border-soft">
            <div class="d-flex justify-content-between align-items-center">
                <h2 class="fw-bold mb-0">
                    <i class="bi bi-people text-primary me-2"></i>
                    Gestión de Personas
                </h2>

                <button class="btn btn-primary rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#personModal">
                    <i class="bi bi-plus-lg me-2"></i>
                    Nueva Persona
                </button>
            </div>
        </div>

        <!-- TABLA -->
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table align-middle mb-0 table-hover">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4 text-center"></th>
                                <th>Nombre</th>
                                <th>Cumpleaños</th>
                                <th>Email</th>
                                <th>Estado</th>
                                <th>Días disponibles</th>
                                <th class="text-end pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="personsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>


    <!-- ============================= -->
    <!-- MODAL PERSONA -->
    <!-- ============================= -->

    <div class="modal fade" id="personModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content rounded-4 shadow border-0">

                <form id="personForm">

                    <!-- HEADER -->
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="modalTitle">
                            <i class="bi bi-person-plus-fill me-2"></i>
                            Nueva Persona
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal">
                        </button>
                    </div>

                    <!-- BODY -->
                    <div class="modal-body">

                        <div id="modalAlertContainer"></div>

                        <h6 class="text-muted mb-3">Datos personales</h6>

                        <div class="row g-4 mb-3">

                            <!-- FOTO -->
                            <div class="col-md-4 text-center">
                                <div class="mb-3">
                                    <img src="/person-circle.svg" alt="Foto de perfil"
                                        class="rounded-circle img-fluid border shadow-sm"
                                        style="width:140px;height:140px;object-fit:cover;" id="personPhotoPreview">
                                </div>

                                <div class="d-grid gap-2">
                                    <input type="file" class="form-control form-control-sm" accept="image/*"
                                        id="personPhoto">

                                    <small class="text-muted">
                                        JPG o PNG · máx 2MB
                                    </small>
                                </div>
                            </div>

                            <!-- DATOS -->
                            <div class="col-md-8">
                                <div class="row g-3">

                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Nombre completo</label>
                                        <input id="personName" class="form-control rounded-3" required>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Nombre de fantasía</label>
                                        <input id="personNickname" class="form-control rounded-3">
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Fecha de nacimiento</label>
                                        <input id="personBirthDate" type="date" class="form-control rounded-3" required>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Email</label>
                                        <input id="personEmail" type="email" class="form-control rounded-3" required>

                                        <div class="form-check form-switch mt-2">
                                            <input class="form-check-input mailStatus" type="checkbox" id="mailStatus">
                                            <label class="form-check-label">
                                                Recibir notificaciones
                                            </label>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>

                        <!-- ESTADO Y FECHAS -->
                        <div class="row g-3 mb-3">

                            <div class="col-md-4">
                                <label class="form-label d-block fw-semibold">Estado</label>
                                <div class="form-check form-switch">
                                    <input class="form-check-input personStatus" type="checkbox" id="personStatus">
                                    <label class="form-check-label">
                                        Activo
                                    </label>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Fecha de entrada</label>
                                <input id="personEntryDate" type="date" class="form-control rounded-3" required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Fecha de salida</label>
                                <input id="personExitDate" type="date" class="form-control rounded-3">
                            </div>
                        </div>

                        <hr>

                        <!-- ASIGNACIONES -->
                        <h6 class="text-muted mb-3">Asignaciones</h6>

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Funciones</label>
                                <select id="personFunctions" class="form-control select2 rounded-3" multiple
                                    style="width:100%;">
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Días de trabajo</label>
                                <select id="personDays" class="form-control select2 rounded-3" multiple required
                                    style="width:100%;">
                                    <option value="MONDAY">Lunes</option>
                                    <option value="TUESDAY">Martes</option>
                                    <option value="WEDNESDAY">Miércoles</option>
                                    <option value="THURSDAY">Jueves</option>
                                    <option value="FRIDAY">Viernes</option>
                                    <option value="SATURDAY">Sábado</option>
                                    <option value="SUNDAY">Domingo</option>
                                </select>
                            </div>

                        </div>
                        
                        <hr>

                        <!-- UNAVAILABILITIES -->
                        <h6 class="text-muted mb-3">Ausencias / No disponibles</h6>

                        <div class="row g-3 mb-3 align-items-end">

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Fecha inicio</label>
                                <input type="date" id="unavailabilityStart" class="form-control rounded-3">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Fecha fin</label>
                                <input type="date" id="unavailabilityEnd" class="form-control rounded-3">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Motivo</label>
                                <input type="text" id="unavailabilityReason" class="form-control rounded-3"
                                    placeholder="Ej: Vacaciones">
                            </div>

                            <div class="col-md-12 mt-2 d-grid">
                                <button type="button" class="btn btn-outline-primary rounded-pill"
                                    id="addUnavailabilityBtn">
                                    <i class="bi bi-plus-lg me-1"></i> Agregar ausencia
                                </button>
                            </div>

                        </div>

                        <ul id="unavailabilitiesList" class="list-group mt-3"></ul>

                    </div>

                    <!-- FOOTER -->
                    <div class="modal-footer justify-content-center">
                        <button type="button" class="btn btn-outline-secondary rounded-pill px-4"
                            data-bs-dismiss="modal">
                            Cancelar
                        </button>

                        <button type="submit" class="btn btn-primary rounded-pill px-4">
                            <i class="bi bi-save me-1"></i>
                            Guardar
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <!-- ======================================= -->
    <!-- MODAL CONFIRMAR ELIMINACIÓN PERSONA -->
    <!-- ======================================= -->

    <div class="modal fade" id="deletePersonModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow rounded-4 border-0">

                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        Confirmar eliminación
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body text-center">
                    <p class="mb-0 fs-5">
                        ¿Seguro que deseas eliminar a
                        <span class="fw-semibold" id="deletePersonName"></span>?
                    </p>
                </div>

                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="button" class="btn btn-danger" id="confirmDeletePersonBtn">
                        <i class="bi bi-trash me-1"></i>
                        Eliminar
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- SCRIPTS (sin tocar nada funcional) -->
    <script src="/js/csrf.js"></script>
    <script src="/plugins/select2/js/select2.full.min.js"></script>
    <script src="/js/select2-modal.js"></script>
    <script src="/js/persons.js"></script>

</section>

</html>
