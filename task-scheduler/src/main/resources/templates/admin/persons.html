<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::section})}">

<section>

    <h1 class="mb-4">
        <i class="nav-icon bi bi-people me-2"></i>
        Personas
    </h1>

    <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#personModal">
        <i class="bi bi-plus"></i> Agregar persona
    </button>

    <div class="card">
        <div class="card-header">
            <h3 class="card-title fw-bold">Personas cargadas</h3>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th class="text-center">#</th>
                            <th>Nombre</th>
                            <th>Cumpleaños</th>
                            <th>Email</th>
                            <th class="text-center">Estado</th>
                            <th class="text-center">Días disponibles</th>
                            <th class="text-end pe-3">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="personsBody">
                        <tr>
                            <td colspan="7" class="text-center text-muted">
                                Sin personas
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <!-- MODAL -->
    <div class="modal fade" id="personModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">

                <form id="personForm">

                    <!-- HEADER -->
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitle">
                            <i class="bi bi-person-plus me-2"></i>Agregar persona
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <!-- BODY -->
                    <div class="modal-body">

                        <!-- DATOS PERSONALES -->
                        <h6 class="text-muted mb-3">Datos personales</h6>

                        <div class="row g-4 mb-3">

                            <!-- FOTO -->
                            <div class="col-md-4 text-center">
                                <div class="mb-2">
                                    <img src="/user8-128x128.jpg" alt="Foto de perfil"
                                        class="rounded-circle img-fluid border"
                                        style="width: 140px; height: 140px; object-fit: cover;" id="personPhotoPreview">
                                </div>

                                <div class="d-grid gap-2">
                                    <input type="file" class="form-control form-control-sm" accept="image/*"
                                        id="personPhoto">

                                    <small class="text-muted">
                                        JPG o PNG · máx 2MB
                                    </small>
                                </div>
                            </div>


                            <!-- DATOS -->
                            <div class="col-md-8">
                                <div class="row g-3">

                                    <div class="col-md-6">
                                        <label for="personName" class="form-label">Nombre completo</label>
                                        <input id="personName" class="form-control" required>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="personNickname" class="form-label">Nombre de fantasía</label>
                                        <input id="personNickname" class="form-control">
                                    </div>

                                    <div class="col-md-6">
                                        <label for="personBirthDate" class="form-label">Fecha de nacimiento</label>
                                        <input id="personBirthDate" type="date" class="form-control" required>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="personEmail" class="form-label">Email</label>
                                        <input id="personEmail" type="email" class="form-control">

                                        <div class="form-check form-switch mt-2">
                                            <input class="form-check-input mailStatus" type="checkbox" id="mailStatus">
                                            <label class="form-check-label" for="mailStatus">
                                                Recibir notificaciones
                                            </label>
                                        </div>
                                    </div>

                                </div>
                            </div>

                        </div>


                        <!-- ESTADO Y FECHAS -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label d-block">Estado</label>
                                <div class="form-check form-switch">
                                    <input class="form-check-input personStatus" type="checkbox" id="personStatus">
                                    <label class="form-check-label" for="personStatus">
                                        Activo
                                    </label>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <label for="personEntryDate" class="form-label">Fecha de entrada</label>
                                <input id="personEntryDate" type="date" class="form-control" required>
                            </div>

                            <div class="col-md-4">
                                <label for="personExitDate" class="form-label">Fecha de salida</label>
                                <input id="personExitDate" type="date" class="form-control">
                            </div>
                        </div>

                        <hr>

                        <!-- FUNCIONES Y DÍAS -->
                        <h6 class="text-muted mb-3">Asignaciones</h6>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="personFunctions" class="form-label">Funciones</label>
                                <select id="personFunctions" class="form-control select2" multiple style="width: 100%;">
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="personDays" class="form-label">Días de trabajo</label>
                                <select id="personDays" class="form-control select2" name="days[]" multiple required
                                    style="width: 100%;">
                                    <option value="MONDAY">Lunes</option>
                                    <option value="TUESDAY">Martes</option>
                                    <option value="WEDNESDAY">Miércoles</option>
                                    <option value="THURSDAY">Jueves</option>
                                    <option value="FRIDAY">Viernes</option>
                                    <option value="SATURDAY">Sábado</option>
                                    <option value="SUNDAY">Domingo</option>
                                </select>
                            </div>
                        </div>

                    </div>

                    <!-- FOOTER -->
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                            Cancelar
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-1"></i>Guardar
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <!-- SCRIPT DE LA PÁGINA -->
    <script src="/js/csrf.js"></script>
    <script src="/plugins/select2/js/select2.full.min.js"></script>
    <script src="/js/select2-modal.js"></script>
    <script src="/js/persons.js"></script>

</section>

</html>
