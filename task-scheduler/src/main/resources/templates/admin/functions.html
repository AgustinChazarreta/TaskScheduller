<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::section})}">
<section>

    <main class="container-fluid py-4">

        <!-- ALERTS -->
        <div id="alertContainer"></div>

        <!-- HEADER -->
        <div class="bg-white rounded-4 shadow-sm p-4 mb-4 border-soft">
            <div class="d-flex justify-content-between align-items-center">
                <h2 class="fw-bold mb-0">
                    <i class="nav-icon bi bi-list-task text-primary me-2"></i>
                    Funciones
                </h2>

                <!-- BOTON AGREGAR -->
                <button class="btn btn-primary rounded-pill px-4" onclick="addFunction()">
                    <i class="bi bi-plus-lg me-1"></i> Agregar función
                </button>

            </div>
        </div>

        <!-- ================= CARGA WORD ================= -->
        <div class="card mb-4 border-0 shadow-sm rounded-4">
            <div class="card-body">
                <input type="file" class="form-control mb-2" id="wordFile" accept=".docx">
                <button class="btn btn-primary rounded-pill px-4" onclick="loadFunctionsFromWord()">
                    <i class="bi bi-upload me-1"></i> Cargar tareas
                </button>
            </div>
        </div>


        <!-- ================= TABLA ================= -->
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table align-middle mb-0 table-hover functions-table">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4 text-center">#</th>
                                <th>Función</th>
                                <th>Tipo</th>
                                <th>Días</th>
                                <th class="text-end pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="functionsBody">
                            <tr>
                                <td colspan="5" class="text-center py-5 text-muted">Sin funciones</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="mt-3 mb-3 ms-3">
                    <button class="btn btn-success rounded-pill px-4" onclick="saveFunctions()">
                        <i class="bi bi-floppy me-1"></i> Guardar funciones
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- ================= MODAL ================= -->
    <div class="modal fade" id="functionModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content rounded-4 shadow border-0">
                <form id="functionForm">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="modalTitle">Agregar función</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre</label>
                            <input id="functionName" class="form-control rounded-3" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tipo de función</label>
                            <select id="sequential" class="form-select rounded-3" required>
                                <option value="" disabled selected>Seleccionar tipo</option>
                                <option value=false>Una vez</option>
                                <option value=true>Recurrente</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Días asignados</label>
                            <select id="personDays" class="form-control select2 rounded-3" multiple required
                                style="width:100%;">
                                <option value="MONDAY">Lunes</option>
                                <option value="TUESDAY">Martes</option>
                                <option value="WEDNESDAY">Miércoles</option>
                                <option value="THURSDAY">Jueves</option>
                                <option value="FRIDAY">Viernes</option>
                                <option value="SATURDAY">Sábado</option>
                                <option value="SUNDAY">Domingo</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer justify-content-center">
                        <button type="button" class="btn btn-outline-secondary rounded-pill px-4"
                            data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-4">
                            <i class="bi bi-save me-1"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ======================================= -->
    <!-- MODAL CONFIRMAR ELIMINACIÓN FUNCIÓN -->
    <!-- ======================================= -->

    <div class="modal fade" id="deleteFunctionModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow rounded-4 border-0">

                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        Confirmar eliminación
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body text-center">
                    <p class="mb-0 fs-5">
                        ¿Seguro que deseas eliminar la función
                        <span class="fw-semibold" id="deleteFunctionName"></span>?
                    </p>
                </div>

                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="button" class="btn btn-danger" id="confirmDeleteFunctionBtn">
                        <i class="bi bi-trash me-1"></i>
                        Eliminar
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- ================= SCRIPTS ================= -->
    <script src="/js/csrf.js"></script>
    <script src="/plugins/select2/js/select2.full.min.js"></script>
    <script src="/js/select2-modal.js"></script>
    <script src="/js/functions.js"></script>

</section>

</html>
